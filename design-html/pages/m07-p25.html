</style><link rel="stylesheet" href="../assets/ui-foundation.css"></head><body><main class="screen" aria-label="糯米的小屋设置"><div class="art-top" role="img" aria-label="糯米与共同照顾它的小满和阿舟"></div><div class="art-middle" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回宠物空间" onclick="location.href='m07-p03.html'"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><h1 class="title">糯米的小屋设置</h1><p class="dog">糯米</p><p class="couple">小满 × 阿舟</p><p class="day">共同照顾中 · 第 <strong>27</strong> 天 <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S2 15 2 8a5 5 0 0 1 10-1A5 5 0 0 1 22 8c0 7-10 13-10 13Z"/></svg></p><h2 class="section remind">共同提醒</h2><button class="row ui-hit-text r1" id="time">共同提醒<small>每天 20:30</small></button><button class="switch s1" role="switch" aria-label="共同提醒" aria-checked="true" data-key="reminder"></button><button class="row ui-hit-text r2" id="notice">照顾通知</button><button class="switch s2" role="switch" aria-label="照顾通知" aria-checked="true" data-key="notice"></button><button class="row ui-hit-text r3" id="story">成长故事自动收录</button><button class="switch s3" role="switch" aria-label="成长故事自动收录" aria-checked="true" data-key="story"></button><h2 class="section privacy">数据与隐私</h2><button class="row ui-hit-text r4" id="export">导出糯米的成长记录</button><button class="row ui-hit-text r5" id="explain">仅我们可见说明</button><h2 class="section relation">关系管理</h2><button class="row ui-hit-text r6" onclick="location.href='m07-p24.html'"><strong>暂时解除共同照顾</strong><small>不会删除糯米与共同回忆</small></button><p class="version">版本 1.2.0</p><div class="toast" role="status"></div></main><script>

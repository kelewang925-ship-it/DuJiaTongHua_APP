<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>糯米的小屋设置 · 独家童话</title><style>

</style></head><body><main class="screen" aria-label="糯米的小屋设置"><div class="art-top" role="img" aria-label="糯米与共同照顾它的小满和阿舟"></div><div class="art-middle" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回宠物空间" onclick="location.href='m07-p03.html'"></button><h1 class="title">糯米的小屋设置</h1><p class="dog">糯米</p><p class="couple">小满 × 阿舟</p><p class="day">共同照顾中 · 第 <strong>27</strong> 天 ♥</p><h2 class="section remind">共同提醒</h2><button class="row r1" id="time">共同提醒<small>每天 20:30</small></button><button class="switch s1" role="switch" aria-label="共同提醒" aria-checked="true" data-key="reminder"></button><button class="row r2" id="notice">照顾通知</button><button class="switch s2" role="switch" aria-label="照顾通知" aria-checked="true" data-key="notice"></button><button class="row r3" id="story">成长故事自动收录</button><button class="switch s3" role="switch" aria-label="成长故事自动收录" aria-checked="true" data-key="story"></button><h2 class="section privacy">数据与隐私</h2><button class="row r4" id="export">导出糯米的成长记录</button><button class="row r5" id="explain">仅我们可见说明</button><h2 class="section relation">关系管理</h2><button class="row r6" onclick="location.href='m07-p24.html'"><strong>暂时解除共同照顾</strong><small>不会删除糯米与共同回忆</small></button><p class="version">版本 1.2.0</p><div class="toast" role="status"></div></main><script>
const toast=document.querySelector('.toast');const tell=s=>{toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',2200)};document.querySelectorAll('.switch').forEach(b=>{const key='fairy-pet-'+b.dataset.key;const saved=localStorage.getItem(key);if(saved==='false'){b.setAttribute('aria-checked','false');b.classList.add('off')}b.onclick=()=>{const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',String(on));b.classList.toggle('off',!on);localStorage.setItem(key,String(on))}});document.getElementById('time').onclick=()=>{const v=prompt('每天提醒时间（HH:MM）','20:30');if(v&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v)){document.querySelector('#time small').textContent='每天 '+v;localStorage.setItem('fairy-pet-remind-time',v)}else if(v)tell('请输入 HH:MM 格式')};document.getElementById('notice').onclick=()=>document.querySelector('.s2').click();document.getElementById('story').onclick=()=>document.querySelector('.s3').click();document.getElementById('export').onclick=()=>location.href='m07-p24.html';document.getElementById('explain').onclick=()=>tell('糯米的成长故事仅对共同照顾的两人可见');const v=localStorage.getItem('fairy-pet-remind-time');if(v)document.querySelector('#time small').textContent='每天 '+v;
</script></body></html>

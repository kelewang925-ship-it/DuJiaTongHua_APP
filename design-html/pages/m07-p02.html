ition:absolute;left:20%;top:89%;width:62%;height:6.5%;border:0;background:transparent;color:#fff;font-size:5.5cqw;cursor:pointer}.footnote{position:absolute;left:31%;top:96.5%;margin:0;color:#8f785c;font-size:3.3cqw;white-space:nowrap}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}

</style><link rel="stylesheet" href="../assets/ui-foundation.css"></head><body><main class="screen" aria-label="选择共同领养的小伙伴"><div class="art-top" aria-hidden="true"></div><div class="art-pets" role="img" aria-label="可选择的小狗、小猫、小兔和小狐狸插画"></div><div class="art-bottom" aria-hidden="true"></div><h1 class="title">一起领养小伙伴</h1><p class="subtitle">选一位陪我们写下故事的小伙伴</p><div class="pets" role="group" aria-label="选择宠物"><button class="pet" data-kind="小狗" aria-pressed="true"><span>小狗</span></button><button class="pet" data-kind="小猫" aria-pressed="false"><span>小猫</span></button><button class="pet" data-kind="小兔" aria-pressed="false"><span>小兔</span></button><button class="pet" data-kind="小狐狸" aria-pressed="false"><span>小狐狸</span></button></div><label class="name-label" for="pet-name">给它取个名字</label><input class="name" id="pet-name" value="糯米" maxlength="12"><p class="couple c1">小满</p><p class="couple c2">阿舟</p><button class="invite" id="invite">邀请 TA 一起领养</button><p class="footnote">以后也可以在图鉴中遇见新伙伴</p></main><script>let kind='小狗';document.querySelectorAll('.pet').forEach(button=>button.addEventListener('click',()=>{kind=button.dataset.kind;document.querySelectorAll('.pet').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));document.querySelector('#invite').addEventListener('click',()=>{const name=document.querySelector('#pet-name').value.trim();if(!name){document.querySelector('#pet-name').focus();return}localStorage.setItem('dujia-pet',JSON.stringify({kind,name}));location.href='m07-p01.html'});</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起领养小伙伴 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#573312;font-family:Fairy,'STFangsong','Songti SC',serif}button,input{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-pets,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m07-p02-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:20%;background-position:left top}.art-pets{top:20%;height:51%;background-position:left -42.34cqw}.art-bottom{top:71%;height:29%;background-position:left -150.32cqw}.title{position:absolute;left:20%;top:7%;margin:0;font-size:9.5cqw;font-weight:400;white-space:nowrap}.subtitle{position:absolute;left:21%;top:15%;margin:0;font-size:4.3cqw;white-space:nowrap}.pets{position:absolute;left:7%;right:7%;top:21%;height:48%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.5%}.pet{position:relative;border:0;background:transparent;cursor:pointer;color:#55320f;font-size:5cqw}.pet span{position:absolute;left:25%;right:25%;bottom:2%;text-align:center}.pet[aria-pressed=true]{outline:.4cqw solid #e9816e;outline-offset:-.5cqw;border-radius:4cqw}.pet[aria-pressed=true]::after{content:'✓';position:absolute;right:3%;top:3%;width:7cqw;height:7cqw;border-radius:50%;background:#ec8a6f;color:#fff;font:600 6cqw system-ui}.pet:first-child[aria-pressed=true]::after{display:none}.name-label{position:absolute;left:22%;top:72%;margin:0;font-size:5cqw}.name{position:absolute;left:54%;top:71.5%;width:28%;border:0;background:transparent;color:#5a3413;text-align:center;font-size:6cqw;outline-color:#e49a77}.couple{position:absolute;top:82%;margin:0;font-size:4.4cqw}.c1{left:13%}.c2{right:10%}.invite{position:absolute;left:20%;top:89%;width:62%;height:6.5%;border:0;background:transparent;color:#fff;font-size:5.5cqw;cursor:pointer}.footnote{position:absolute;left:31%;top:96.5%;margin:0;color:#8f785c;font-size:3.3cqw;white-space:nowrap}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="选择共同领养的小伙伴"><div class="art-top" aria-hidden="true"></div><div class="art-pets" role="img" aria-label="可选择的小狗、小猫、小兔和小狐狸插画"></div><div class="art-bottom" aria-hidden="true"></div><h1 class="title">一起领养小伙伴</h1><p class="subtitle">选一位陪我们写下故事的小伙伴</p><div class="pets" role="group" aria-label="选择宠物"><button class="pet" data-kind="小狗" aria-pressed="true"><span>小狗</span></button><button class="pet" data-kind="小猫" aria-pressed="false"><span>小猫</span></button><button class="pet" data-kind="小兔" aria-pressed="false"><span>小兔</span></button><button class="pet" data-kind="小狐狸" aria-pressed="false"><span>小狐狸</span></button></div><label class="name-label" for="pet-name">给它取个名字</label><input class="name" id="pet-name" value="糯米" maxlength="12"><p class="couple c1">小满</p><p class="couple c2">阿舟</p><button class="invite" id="invite">邀请 TA 一起领养</button><p class="footnote">以后也可以在图鉴中遇见新伙伴</p></main><script>let kind='小狗';document.querySelectorAll('.pet').forEach(button=>button.addEventListener('click',()=>{kind=button.dataset.kind;document.querySelectorAll('.pet').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));document.querySelector('#invite').addEventListener('click',()=>{const name=document.querySelector('#pet-name').value.trim();if(!name){document.querySelector('#pet-name').focus();return}localStorage.setItem('dujia-pet',JSON.stringify({kind,name}));location.href='m07-p01.html'});</script></body></html>

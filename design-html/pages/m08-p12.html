<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品与宠物成长 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#603a1e;font-family:Fairy,'STFangsong','Songti SC',serif}button,input{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-middle,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m08-p12-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:42%;background-position:left top}.art-middle{top:42%;height:40%;background-position:left -88.93cqw}.art-bottom{top:82%;height:18%;background-position:left -173.61cqw}h1,h2,p{position:absolute;margin:0;font-weight:400}.back{position:absolute;left:4%;top:2%;width:8%;height:5%;border:0;background:transparent;cursor:pointer}.title{left:30%;top:2.8%;font-size:6.7cqw}.tabs{position:absolute;left:17%;right:17%;top:9.2%;height:5%;display:grid;grid-template-columns:1fr 1fr;gap:9%}.tabs button{border:0;background:transparent;color:#634026;font-size:5.1cqw;cursor:pointer}.tabs button[aria-selected=true]{color:#cf765b}.pet-name{left:43%;top:20%;font-size:6cqw}.milestone-label{left:45%;top:28.6%;font-size:3.8cqw}.milestone{left:49%;top:31.7%;font-size:4.4cqw}.date{left:48%;top:35.8%;font-size:3.6cqw}.caption{position:absolute;left:28%;top:70%;width:52%;height:4%;border:0;outline:0;background:transparent;color:#674027;font-size:4.6cqw}.actions{position:absolute;left:20%;right:19%;top:78%;height:5%;display:grid;grid-template-columns:repeat(3,1fr);gap:2%}.actions button{border:0;background:transparent;color:#62402a;font-size:3.8cqw;cursor:pointer;padding-top:6cqw}.done{position:absolute;left:27%;top:87%;width:46%;height:5.5%;border:0;background:transparent;color:#fff;font-size:5.7cqw;cursor:pointer}.toast{ </style></head><body><main class="screen" aria-label="宠物成长书页"><div class="art-top" role="img" aria-label="团子的成长相册与两张照片"></div><div class="art-middle" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回版式选择" onclick="location.href='m08-p08.html'"></button><h1 class="title">作品与宠物成长</h1><div class="tabs" role="tablist"><button role="tab" aria-selected="false" data-tab="工坊作品">工坊作品</button><button role="tab" aria-selected="true" data-tab="宠物成长">宠物成长</button></div><h2 class="pet-name">团子 ♥</h2><p class="milestone-label">成长里程碑</p><p class="milestone">学会握手</p><p class="date">2024.05.20 ♥</p><input class="caption" aria-label="成长说明" value="今天也得到一颗小饼干 ♡"><div class="actions"><button type="button" data-action="换内容">换内容</button><button type="button" data-action="换照片">换照片</button><button type="button" data-action="添加说明">添加说明</button></div><button class="done" type="button">完成这一页</button><div class="toast" role="status"></div></main><script>

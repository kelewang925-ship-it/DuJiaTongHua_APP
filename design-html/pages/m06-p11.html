<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据与存储 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#633d23;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-list,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m06-p11-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:43%;background-position:left top}.art-list{top:43%;height:51%;background-position:left -91.04cqw}.art-bottom{top:94%;height:6%;background-position:left -199.02cqw}.back{position:absolute;left:3%;top:4%;width:13%;height:8%;border:0;background:transparent;cursor:pointer}.title{position:absolute;left:19%;top:5.4%;margin:0;font-size:7.5cqw;font-weight:400}.used{position:absolute;left:31%;top:44.5%;margin:0;font-size:4cqw}.quantity{position:absolute;left:31%;top:47%;margin:0;font-size:7cqw;color:#8d3d25}.quantity small{font-size:3.8cqw;color:#4e321c}.row{position:absolute;left:5%;right:7%;height:7%;border:0;background:transparent;text-align:left;padding-left:20%;color:#5d3c23;font-size:5.2cqw;cursor:pointer}.export{top:56%}.backup{top:64%}.automatic{top:72%;pointer-events:none}.manage{top:80%}.cache{top:88%}.cache span{float:right;margin-right:8%;font-size:4cqw;color:#a65a3e}.switch{position:absolute;left:78%;top:73.4%;width:12%;height:4%;border:0;border-radius:20cqw;background:transparent;cursor:pointer}.switch[aria-checked=false]{background:#d3c8bd}.switch[aria-checked=false]::after{content:'';position:absolute;left:5%;top:6%;width:55%;height:88%;border-radius:50%;background:#fff}.note{position:absolute;left:25%;top:95.5%;margin:0;font-size:3.7cqw;white-space:nowrap}.toast{position:absolute;left:18%;right:18%;bottom:13%;display:none;padding:2cqw;border-radius:2cqw;background:#624534;color:#fff;text-align:center;font-size:3cqw}.toast.show{display:block}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="数据与存储"><div class="art-top" role="img" aria-label="装满共同回忆的收纳箱插画"></div><div class="art-list" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回设置" onclick="location.href='m06-p07.html'"></button><h1 class="title">数据与存储</h1><p class="used">已使用</p><p class="quantity">1.2 GB <small>/ 5 GB</small></p><button class="row export" id="export">导出我的记录</button><button class="row backup" id="backup">共同记录备份</button><div class="row automatic">自动备份</div><button class="switch" id="auto" role="switch" aria-label="自动备份" aria-checked="true"></button><button class="row manage" onclick="notify('存储空间：1.2 GB / 5 GB')">存储空间管理</button><button class="row cache" id="cache">清理缓存 <span>128 MB</span></button><p class="note">导出文件只包含你有权限查看的内容</p><p class="toast" id="toast" role="status"></p></main><script>function notify(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}const auto=document.querySelector('#auto');auto.setAttribute('aria-checked',localStorage.getItem('dujia-auto-backup')??'true');auto.addEventListener('click',()=>{const value=auto.getAttribute('aria-checked')!=='true';auto.setAttribute('aria-checked',String(value));localStorage.setItem('dujia-auto-backup',String(value))});document.querySelector('#backup').addEventListener('click',()=>{localStorage.setItem('dujia-last-backup',new Date().toISOString());notify('共同记录备份已创建')});document.querySelector('#export').addEventListener('click',()=>{const data={profile:localStorage.getItem('dujia-profile'),privacy:localStorage.getItem('dujia-privacy'),notifications:localStorage.getItem('dujia-notifications')};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='dujia-records.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出本地演示资料')});document.querySelector('#cache').addEventListener('click',()=>{document.querySelector('#cache span').textContent='0 MB';notify('演示缓存已清理')});</script></body></html>

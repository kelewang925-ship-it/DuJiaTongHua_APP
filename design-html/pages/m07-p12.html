</style></head><body><main class="screen" aria-label="给糯米换装"><div class="art-top" aria-hidden="true"></div><div class="art-closet" role="img" aria-label="糯米在自己的小衣橱里"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回宠物小屋" onclick="location.href='m07-p03.html'"></button><h1 class="title">给糯米换新装</h1><p class="couple">小满 × 阿舟</p><div class="tabs" role="tablist"><button role="tab" aria-selected="false">衣服</button><button role="tab" aria-selected="true">配饰</button><button role="tab" aria-selected="false">小物</button></div><p class="closet-name">糯米的<br>小衣橱 ♡</p><p class="stats">♡ 亲密度 <strong>128</strong>　♧ 今日已试穿 <strong>1</strong> 次</p><div class="item-list" role="group" aria-label="选择配饰"><button class="item" data-name="小花围巾" aria-pressed="true"><strong>小花围巾</strong><small>已拥有</small></button><button class="item" data-name="格纹蝴蝶结" aria-pressed="false"><strong>格纹蝴蝶结</strong><small>已拥有</small></button><button class="item locked" data-name="星星领结" aria-pressed="false"><strong>星星领结</strong><small>亲密度 160</small></button><button class="item locked" data-name="蜜桃帽子" aria-pressed="false"><strong>蜜桃帽子</strong><small>完成故事解锁</small></button></div><p class="note">小满换上的装扮，阿舟也会立刻看到 ♡</p><button class="save" id="save">保存这身搭配</button><p class="toast" id="toast" role="status"></p></main><script>let selected=document.querySelector('.item');const toast=document.querySelector('#toast');function notify(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2300)}document.querySelectorAll('.item').forEach(button=>button.addEventListener('click',()=>{if(button.classList.contains('locked')){notify('这件配饰尚未解锁');return}selected=button;document.querySelectorAll('.item').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));document.querySelector('#save').addEventListener('click',()=>{localStorage.setItem('dujia-pet-outfit',selected.dataset.name);notify('已保存：'+selected.dataset.name)});document.querySelectorAll('.tabs button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(item=>item.setAttribute('aria-selected',String(item===button)))}));</script></body></html>

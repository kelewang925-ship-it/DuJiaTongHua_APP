<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和糯米玩一会儿 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#5b3519;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-options,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m07-p06-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:50%;background-position:left top}.art-options{top:50%;height:37%;background-position:left -105.86cqw}.art-bottom{top:87%;height:13%;background-position:left -184.2cqw}.title{position:absolute;left:23%;top:4.8%;margin:0;font-size:9.4cqw;font-weight:400;white-space:nowrap}.couple{position:absolute;left:37%;top:12.7%;margin:0;font-size:4.5cqw;white-space:nowrap}.limit{position:absolute;left:33%;top:17.5%;margin:0;font-size:4.2cqw}.limit strong{color:#e88570;font-size:5.5cqw;font-weight:400}.name{position:absolute;left:56%;top:36.5%;margin:0;font-size:3.2cqw;transform:rotate(8deg)}.options{position:absolute;left:4%;right:4%;top:50%;height:27%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2%}.option{position:relative;border:0;background:transparent;text-align:left;color:#5b3519;cursor:pointer}.option[aria-pressed=true]{outline:.3cqw solid #eb9477;border-radius:4cqw}.option strong{position:absolute;left:53%;top:31%;font-size:5.2cqw;font-weight:400;white-space:nowrap}.option small{position:absolute;left:48%;top:61%;font-size:2.5cqw;white-space:nowrap}.stats{position:absolute;left:6%;right:5%;top:80%;height:6%;display:flex}.stats span{flex:1;padding-left:11%;font-size:3.8cqw}.stats strong{display:block;font-size:4.5cqw;font-weight:400}.play{position:absolute;left:22%;top:88%;width:58%;height:7%;border:0;background:transparent;color:#fff;font-size:7cqw;cursor:pointer}.hint{position:absolute;left:23%;top:96%;margin:0;font-size:3.5cqw;white-space:nowrap}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="和糯米互动"><div class="art-top" role="img" aria-label="糯米坐在玩具和花朵旁"></div><div class="art-options" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><h1 class="title">和糯米玩一会儿</h1><p class="couple"><span style="color:#e77f6b">小满</span> × <span style="color:#6786ba">阿舟</span></p><p class="limit">🐾 今天还可以陪它玩 <strong>2</strong> 次</p><p class="name">糯米</p><div class="options" role="group" aria-label="互动方式"><button class="option" data-energy="5" aria-pressed="true"><strong>摸摸头</strong><small>精力 -5 · 亲密 +3</small></button><button class="option" data-energy="12" aria-pressed="false"><strong>丢球球</strong><small>精力 -12 · 心情 +8</small></button><button class="option" data-energy="8" aria-pressed="false"><strong>讲故事</strong><small>精力 -8 · 亲密 +6</small></button><button class="option" data-energy="0" aria-pressed="false"><strong>送小礼物</strong><small>消耗 1 份礼物</small></button></div><div class="stats"><span>精力<strong id="energy">82</strong></span><span>心情<strong>很开心</strong></span><span>亲密度<strong>128</strong></span></div><button class="play" id="play">和糯米互动</button><p class="hint">两个人都可以发起互动，奖励不会重复领取</p></main><script>let selected=document.querySelector('.option');document.querySelectorAll('.option').forEach(button=>button.addEventListener('click',()=>{selected=button;document.querySelectorAll('.option').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));document.querySelector('#play').addEventListener('click',()=>{const energy=Number(localStorage.getItem('dujia-pet-energy')??82);if(energy<Number(selected.dataset.energy)){location.href='m07-p07.html';return}localStorage.setItem('dujia-pet-energy',String(energy-Number(selected.dataset.energy)));location.href='m07-p05.html'});document.querySelector('#energy').textContent=localStorage.getItem('dujia-pet-energy')??'82';</script></body></html>

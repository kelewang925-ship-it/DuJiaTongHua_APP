<style>

</style></head><body><main class="screen" aria-label="情侣资料"><div class="hero" role="img" aria-label="小满和阿舟的水彩头像"></div><div class="footer-art" aria-hidden="true"></div><button class="back" type="button" aria-label="返回" onclick="location.href='m02-p05.html'">‹</button><h1 class="title">我们的小资料</h1><p class="name girl">小满</p><p class="name boy">阿舟</p><p class="days">在一起的第 <b>214</b> 天</p><form class="details" id="profile"><div class="row"><label for="nickname">情侣昵称 <span class="heart">♥</span></label><input id="nickname" name="nickname" value="晚风和小满" aria-label="情侣昵称"><span class="arrow" aria-hidden="true">›</span></div><div class="row"><label for="met">相遇日期 <span class="heart">▦</span></label><input id="met" name="met" value="2026 年 2 月 1 日" aria-label="相遇日期"><span class="arrow" aria-hidden="true">›</span></div><div class="row"><label for="anniversary">共同纪念日 <span class="heart">★</span></label><input id="anniversary" name="anniversary" value="每月 1 日" aria-label="共同纪念日"><span class="arrow" aria-hidden="true">›</span></div></form><button class="save" type="submit" form="profile">♥　保存小资料</button><p class="privacy">♙ 这些信息只属于你们两个人</p><p class="toast" id="toast" role="status"></p></main><script>const form=document.querySelector('#profile'),toast=document.querySelector('#toast');for(const input of form.elements){if(input.name){const saved=localStorage.getItem('dujia-profile-'+input.name);if(saved)input.value=saved}}form.addEventListener('submit',event=>{event.preventDefault();for(const input of form.elements){if(input.name)localStorage.setItem('dujia-profile-'+input.name,input.value)}toast.textContent='小资料已保存在当前浏览器';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)});</script></body></html>

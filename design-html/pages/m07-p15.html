<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起布置糯米的小屋 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#754c2b;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-middle,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m07-p15-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:64%;background-position:left top}.art-middle{top:64%;height:23%;background-position:left -135.5cqw}.art-bottom{top:87%;height:13%;background-position:left -184.18cqw}h1,p{position:absolute;margin:0;font-weight:400}.title{left:14%;top:3.7%;width:76%;font-size:8.8cqw;text-align:center;white-space:nowrap}.couple{left:35%;top:12.3%;font-size:4.2cqw}.style{left:12%;top:19%;font-size:3.8cqw}.saved{position:absolute;right:6%;top:18.4%;width:16%;height:3%;border:0;background:transparent;color:#bc7253;font-size:2.8cqw;white-space:nowrap}.plaque{left:28%;top:31%;font-size:3cqw;color:#a77850}.tabs{position:absolute;left:6.5%;right:7%;top:63.2%;height:4%;display:grid;grid-template-columns:repeat(4,1fr);gap:3%}.tabs button{border:0;background:transparent;color:#68451e;font-size:4.1cqw;cursor:pointer}.tabs button[aria-selected=true]{color:#fff}.cards{position:absolute;left:5.5%;right:6%;top:68.5%;height:16.5%;display:grid;grid-template-columns:repeat(4,1fr);gap:1%}.cards button{position:relative;border:0;background:transparent;color:#663e21;cursor:pointer;padding:0}.cards strong{position:absolute;left:0;right:0;top:57%;font-size:3.8cqw;font-weight:400;white-space:nowrap}.cards small{position:absolute;left:0;right:0;top:72%;font-size:2.9cqw;color:#ae7651;white-space:nowrap}.cards button[aria-pressed=true]:after{content:'✓';position:absolute;right:7%;top:2%;color:#fff;font-size:3cqw}.collab{left:20%;top:88%;width:68%;font-size:3.5cqw;white-space:nowrap}.save{position:absolute;left:23%;top:92.3%;width:54%;height:5.4%;border:0;background:transparent;color:#fff;font-size:6cqw;cursor:pointer}.toast{position:absolute;left:15%;right:15%;bottom:8%;padding:1cqw;background:#fff8eb;border:1px solid #dca77b;border-radius:2cqw;text-align:center;font-size:3cqw;display:none}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="一起布置糯米的小屋"><div class="art-top" role="img" aria-label="春日奶油屋内，糯米坐在花朵地毯上"></div><div class="art-middle" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><h1 class="title">一起布置糯米的小屋</h1><p class="couple">小满 × 阿舟</p><p class="style">当前风格：春日奶油屋</p><span class="saved" role="status">✓ 已保存</span><p class="plaque">糯米</p><div class="tabs" role="tablist" aria-label="布置分类"><button role="tab" aria-selected="true" data-tab="地毯">地毯</button><button role="tab" aria-selected="false" data-tab="小床">小床</button><button role="tab" aria-selected="false" data-tab="墙饰">墙饰</button><button role="tab" aria-selected="false" data-tab="摆件">摆件</button></div><div class="cards" aria-label="可选择的地毯"><button type="button" aria-pressed="true" data-item="花朵地毯"><strong>花朵地毯</strong><small>已使用</small></button><button type="button" aria-pressed="false" data-item="格纹地毯"><strong>格纹地毯</strong><small>可使用</small></button><button type="button" aria-pressed="false" data-locked="亲密度 150"><strong>月亮地毯</strong><small>♥ 亲密度 150</small></button><button type="button" aria-pressed="false" data-locked="成就解锁"><strong>野餐垫</strong><small>🔒 成就解锁</small></button></div><p class="collab">阿舟正在挑选墙饰，保存后会同步给小满</p><button class="save" type="button">保存小屋布置</button><div class="toast" role="status"></div></main><script>
const toast=document.querySelector('.toast');const tell=s=>{toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',2200)};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.tab!=='地毯'){tell('“'+b.dataset.tab+'”布置即将开放');return}document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'))});document.querySelectorAll('.cards button').forEach(b=>b.onclick=()=>{if(b.dataset.locked){tell(b.dataset.locked+'后可解锁');return}document.querySelectorAll('.cards button').forEach(x=>{x.setAttribute('aria-pressed',x===b?'true':'false');if(!x.dataset.locked)x.querySelector('small').textContent=x===b?'已选中':'可使用'});localStorage.setItem('fairy-room-rug',b.dataset.item)});document.querySelector('.save').onclick=()=>{localStorage.setItem('fairy-room-saved',new Date().toISOString());location.href='m07-p14.html'};
</script></body></html>

</style></head><body><main class="screen" aria-label="给糯米喂食"><div class="art-hero" role="img" aria-label="糯米和装满狗粮的食盆"></div><div class="art-food" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><h1 class="title">给糯米<br>喂点好吃的</h1><p class="satiety">当前饱食度 <strong id="satiety">76</strong> / 100</p><h2 class="warehouse">我的小仓库</h2><div class="stock"><span>狗粮<strong id="stock0">12</strong></span><span>小饼干<strong id="stock1">5</strong></span><span>草莓布丁<strong id="stock2">1</strong></span></div><div class="foods" role="group" aria-label="选择食物"><button data-index="0" aria-pressed="true"><strong>香香狗粮</strong><small>×12</small><em>🐾 饱食 +12</em></button><button data-index="1" aria-pressed="false"><strong>爱心小饼干</strong><small>×5</small><em>🐾 饱食 +8</em></button><button data-index="2" aria-pressed="false"><strong>草莓布丁</strong><small>×1</small><em>🐾 饱食 +20</em></button></div><p class="shared">今天<b>小满</b>已经喂过一次，<br><b>阿舟</b>仍可一起喂食</p><p class="time">◷ 09:15 小满喂了香香狗粮</p><button class="feed" id="feed">喂给糯米</button><button class="more" onclick="location.href='m07-p10.html'">去获得更多食物 ›</button><p class="toast" id="toast" role="status"></p></main><script>let selected=0;let stock=JSON.parse(localStorage.getItem('dujia-food-stock')||'[12,5,1]');let satiety=Number(localStorage.getItem('dujia-pet-satiety')||76);function render(){stock.forEach((count,index)=>{document.querySelector('#stock'+index).textContent=count;document.querySelector('[data-index="'+index+'"] small').textContent='×'+count});document.querySelector('#satiety').textContent=satiety}document.querySelectorAll('.foods button').forEach(button=>button.addEventListener('click',()=>{selected=Number(button.dataset.index);document.querySelectorAll('.foods button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));document.querySelector('#feed').addEventListener('click',()=>{if(stock[selected]<=0){location.href='m07-p09.html';return}stock[selected]--;satiety=Math.min(100,satiety+[12,8,20][selected]);localStorage.setItem('dujia-food-stock',JSON.stringify(stock));localStorage.setItem('dujia-pet-satiety',String(satiety));const toast=document.querySelector('#toast');toast.textContent='糯米吃得很开心！';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2300);render()});render();</script></body></html>

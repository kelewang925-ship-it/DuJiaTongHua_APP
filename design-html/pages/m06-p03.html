<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们的小世界 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#694323;font-family:Fairy,'STFangsong','Songti SC',serif}button,input{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-hero,.art-menu,.art-foot{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m06-p03-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-hero{top:0;height:52%;background-position:left top}.art-menu{top:52%;height:36%;background-position:left -110.1cqw}.art-foot{top:88%;height:12%;background-position:left -186.32cqw}.back{position:absolute;left:2%;top:1%;width:12%;height:7%;border:0;background:transparent;cursor:pointer}.title{position:absolute;top:2.3%;left:30%;margin:0;font-size:7.7cqw;font-weight:400;white-space:nowrap}.person{position:absolute;top:35.6%;width:23%;margin:0;text-align:center;font-size:5cqw}.p1{left:22%}.p2{right:20%}.status{position:absolute;top:44%;left:24%;right:13%;margin:0;text-align:center;font-size:5.5cqw;color:#9a503c;white-space:nowrap}.row{position:absolute;left:5%;right:5%;height:8%;border:0;background:transparent;text-align:left;padding-left:18%;color:#5d3d24;font-size:5.1cqw;cursor:pointer}.row span{float:right;margin-right:6%;color:#9b7959;font-size:4.2cqw}.nick{top:53.5%}.portrait{top:62%}.space{top:70.5%;line-height:1.15}.space small{display:block;color:#a98769;font-size:3.3cqw}.connection{top:79%}.unlink{position:absolute;left:8%;right:8%;top:90%;height:6%;border:0;background:transparent;color:#ad5c40;font-size:5.5cqw;cursor:pointer}.toast{position:absolute;left:20%;right:20%;bottom:13%;display:none;padding:2cqw;border-radius:2cqw;background:#624532;color:#fff;text-align:center;font-size:3cqw}.toast.show{display:block}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="我们的小世界"><div class="art-hero" role="img" aria-label="小屋前的情侣头像插画"></div><div class="art-menu" aria-hidden="true"></div><div class="art-foot" aria-hidden="true"></div><button class="back" aria-label="返回我的与设置" onclick="location.href='m06-p01.html'"></button><h1 class="title">我们的小世界</h1><p class="person p1">小满</p><p class="person p2">阿舟</p><p class="status">已关联 · 我们的小世界</p><button class="row nick" onclick="editNickname()">共同昵称 <span id="joint-name">小满与阿舟</span></button><button class="row portrait" onclick="location.href='m06-p02.html'">共同头像</button><button class="row space" onclick="location.href='m06-p09.html'">共同空间设置<small>哪些记录邀请对方一起看</small></button><button class="row connection" onclick="notify('我们的关联状态：已关联')">关联状态</button><button class="unlink" onclick="notify('解除关联需要双方确认')">⚠ 解除关联</button><p class="toast" id="toast" role="status"></p></main><script>function notify(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}function editNickname(){const old=document.querySelector('#joint-name').textContent;const value=prompt('共同昵称',old);if(value?.trim()){document.querySelector('#joint-name').textContent=value.trim();localStorage.setItem('dujia-joint-name',value.trim())}}const saved=localStorage.getItem('dujia-joint-name');if(saved)document.querySelector('#joint-name').textContent=saved;</script></body></html>

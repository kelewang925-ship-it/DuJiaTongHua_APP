<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>标签管理 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#603b21;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-head,.art-tags,.art-foot{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m06-p05-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-head{top:0;height:21%;background-position:left top}.art-tags{top:21%;height:67%;background-position:left -44.46cqw}.art-foot{top:88%;height:12%;background-position:left -186.32cqw}.back{position:absolute;left:5%;top:4%;width:14%;height:9%;border:0;background:transparent;cursor:pointer}.title{position:absolute;left:36%;top:5.5%;margin:0;font-size:7.5cqw;font-weight:400}.plus{position:absolute;right:5%;top:4%;width:16%;height:9%;border:0;background:transparent;color:#5b381e;font-size:9cqw;cursor:pointer}.heading{position:absolute;left:18%;margin:0;font-size:5cqw;font-weight:400}.mine-title{top:15.7%}.shared-title{top:52%}.tag{position:absolute;border:0;background:transparent;color:#603b21;cursor:pointer;font-size:5.3cqw;text-align:center}.personal{width:37%;height:8%}.daily{left:12%;top:24%}.travel{left:54%;top:24%}.missing{left:12%;top:36%}.food{left:54%;top:36%}.shared{left:10%;right:10%;height:7%;padding-left:24%;text-align:center}.picnic{top:58%}.first-trip{top:68.2%}.home{top:78.2%}.add{position:absolute;left:24%;top:89.6%;width:55%;height:7%;border:0;background:transparent;color:#fff;font-size:6cqw;cursor:pointer}.toast{position:absolute;left:20%;right:20%;bottom:12%;display:none;padding:2cqw;background:#654a35;color:#fff;border-radius:2cqw;text-align:center;font-size:3cqw}.toast.show{display:block}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}

/* Original-design audit corrections. */
.title{font-weight:500;font-size:6.5cqw}.heading{font-weight:500;font-size:4.4cqw}.tag{font-weight:500;font-size:4.9cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4cqw;padding-left:4cqw}.shared{padding-left:27%;padding-right:10%}.plus{display:grid;place-items:center;padding:0}.plus .ui-icon{width:7cqw;height:7cqw}.add{font-weight:400;font-size:5.2cqw}.back{left:calc(12% - 22px);top:calc(7.9% - 22px);width:44px;height:44px;display:grid;place-items:center;padding:0;color:#965e38}.back .ui-icon{width:9cqw;height:9cqw;max-width:36px;max-height:36px;background:url('../assets/m06-p05-art.webp') -42cqw -1cqw/100cqw 211.72cqw no-repeat;border-radius:50%}
.toast{font-size:3.5cqw;line-height:1.5;overflow-wrap:anywhere}


</style><link rel="stylesheet" href="../assets/ui-foundation.css"></head><body><main class="screen" aria-label="标签管理"><div class="art-head" aria-hidden="true"></div><div class="art-tags" aria-hidden="true"></div><div class="art-foot" aria-hidden="true"></div><button class="back" aria-label="返回我的与设置" onclick="location.href='m06-p01.html'"><svg class="ui-icon" viewBox="-2 -2 28 28" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg></button><h1 class="title">标签管理</h1><button class="plus" aria-label="新建标签" onclick="addTag()"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button><h2 class="heading mine-title">我的标签</h2><button class="tag personal daily" data-key="daily" onclick="editTag(this)">日常</button><button class="tag personal travel" data-key="travel" onclick="editTag(this)">旅行</button><button class="tag personal missing" data-key="missing" onclick="editTag(this)">想念</button><button class="tag personal food" data-key="food" onclick="editTag(this)">美食</button><h2 class="heading shared-title">共同标签</h2><button class="tag shared picnic" data-key="picnic" onclick="editTag(this)">春日野餐</button><button class="tag shared first-trip" data-key="first-trip" onclick="editTag(this)">第一次旅行</button><button class="tag shared home" data-key="home" onclick="editTag(this)">我们的家</button><button class="add" onclick="addTag()">新建标签</button><p class="toast" id="toast" role="status"></p></main><script>const key='dujia-tags';const tags=[...document.querySelectorAll('.tag')];try{const saved=JSON.parse(localStorage.getItem(key));tags.forEach(tag=>{if(saved?.[tag.dataset.key])tag.textContent=saved[tag.dataset.key]})}catch{}function persist(){localStorage.setItem(key,JSON.stringify(Object.fromEntries(tags.map(tag=>[tag.dataset.key,tag.textContent]))))}function editTag(tag){const value=prompt('编辑标签',tag.textContent);if(value?.trim()){tag.textContent=value.trim();persist()}}function addTag(){const value=prompt('新建标签');if(value?.trim()){const custom=JSON.parse(localStorage.getItem('dujia-extra-tags')||'[]');custom.push(value.trim());localStorage.setItem('dujia-extra-tags',JSON.stringify(custom));const toast=document.querySelector('#toast');toast.textContent='已新建标签：'+value.trim();toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}}</script></body></html>

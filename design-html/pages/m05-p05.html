<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回忆影片编辑 · 独家童话</title>
<style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8dfd5;color:#5a3824;font-family:Fairy,'STFangsong','Songti SC',serif}button,textarea{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-clips,.art-bottom{position:absolute;left:0;right:0;z-index:-1;background-image:url('../assets/m05-p05-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:22%;background-position:left top}.art-clips{top:22%;height:41%;background-position:left -46.58cqw}.art-bottom{top:63%;height:37%;background-position:left -133.38cqw}.back{position:absolute;left:4%;top:2%;width:10%;height:6%;border:0;background:transparent;cursor:pointer}.title{position:absolute;left:6%;top:7%;margin:0;font-size:9cqw;font-weight:400}.subtitle{position:absolute;left:6%;top:14%;margin:0;font-size:3.5cqw}.clips-heading,.narration-heading,.music-heading,.mood-heading{position:absolute;left:12%;margin:0;font-size:4.5cqw;font-weight:400}.clips-heading{top:22%}.clips{position:absolute;left:15%;right:10%;top:26%;height:35%;display:flex;flex-direction:column;justify-content:space-between}.clip{position:relative;height:31%;border:0;background:transparent;color:#51331f;text-align:left;cursor:pointer}.clip .tag{position:absolute;left:41%;top:7%;font-size:3.6cqw}.clip b{position:absolute;left:41%;top:37%;font-size:5cqw;font-weight:400;white-space:nowrap}.clip small{position:absolute;left:41%;top:69%;color:#9b8879;font-size:3.6cqw}.clip[aria-current=true]{outline:.18cqw solid #efa58b;border-radius:2cqw}.narration-heading{top:63.3%}.narration{position:absolute;left:17%;top:67%;width:68%;height:6%;padding:0;border:0;resize:none;outline-color:#d99471;background:transparent;color:#583924;font- </style></head><body><main class="screen" aria-label="回忆影片编辑"><div class="art-top" role="img" aria-label="放映回忆的老式电影机"></div><div class="art-clips" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" type="button" aria-label="返回工坊" onclick="location.href='m05-p01.html'"></button><h1 class="title">回忆影片</h1><p class="subtitle">把我们的回忆，变成一部专属影片</p><h2 class="clips-heading">▣ 回忆片段</h2><section class="clips" aria-label="影片片段"><button class="clip" type="button" aria-current="true"><span class="tag">日记</span><b>那天的日落</b><small>▦ 2023年05月20日</small></button><button class="clip" type="button" aria-current="false"><span class="tag">照片</span><b>海边笑起来</b><small>▦ 2023年08月14日</small></button><button class="clip" type="button" aria-current="false"><span class="tag">重要时刻</span><b>第一次旅行</b><small>▦ 2023年10月03日</small></button></section><h2 class="narration-heading">✎ 旁白</h2><textarea class="narration" id="narration" aria-label="影片旁白">有些瞬间，被时间轻轻收藏，&#10;在回忆里，永远温柔发光。</textarea><h2 class="music-heading">♫ 配乐</h2><p class="music-name">晚风和海浪</p><button class="music-play" type="button" id="play" aria-label="试听晚风和海浪"></button><h2 class="mood-heading">▣ 影片氛围</h2><div class="moods" role="group" aria-label="影片氛围"><button type="button" aria-pressed="true">温柔手帐</button><button type="button" aria-pressed="false">治愈暖光</button><button type="button" aria-pressed="false">清新自然</button></div><button class="generate" type="button" id="generate">生成回忆影片</button><p class="toast" id="toast" role="status"></p></main><script>document.querySelectorAll('.clip').forEach(button=>button.addEventListener('click',()=>document.querySelectorAll('.clip').forEach(item=>item.setAttribute('aria-current',String(item===button)))));document.querySelectorAll('.moods button').forEach(button=>button.addEventListener('click',()=>document.querySelectorAll('.moods button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))));document.querySelector('#play').addEventListener('click',()=>{const toast=document.querySelector('#toast');toast.textContent='当前演示没有音频文件';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)});document.querySelector('#generate').addEventListener('click',()=>{localStorage.setItem('dujia-film-narration',document.querySelector('#narration').value);location.href='m05-p06.html'});</script></body></html>

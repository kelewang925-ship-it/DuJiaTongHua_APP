</style></head><body><main class="screen" aria-label="帮助与关于"><div class="art-top" role="img" aria-label="翻开的童话书和问号星星插画"></div><div class="art-list" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回我的与设置" onclick="location.href='m06-p01.html'"></button><h1 class="title">帮助与关于</h1><p class="book-text">把平凡的日子<br>写成童话</p><button class="row help" onclick="notify('使用帮助：从首页记录你们的日常，在工坊创作专属作品')">使用帮助</button><button class="row feedback" onclick="feedback()">意见反馈</button><button class="row privacy" onclick="notify('隐私政策：你的私人记录由你决定是否共同可见')">隐私政策</button><button class="row terms" onclick="notify('用户协议：请爱护共同空间中的每一段回忆')">用户协议</button><button class="row updates" onclick="notify('当前已是最新版本')">检查更新</button><button class="row about" onclick="notify('独家童话 1.0.0 · 把平凡的日子写成童话')">关于独家童话</button><p class="version">独家童话 1.0.0 · 把平凡的日子写成童话</p><p class="toast" id="toast" role="status"></p></main><script>function notify(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2700)}function feedback(){const value=prompt('写下你的意见反馈');if(value?.trim()){localStorage.setItem('dujia-feedback-draft',value.trim());notify('反馈草稿已保存在本机')}};</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>重设密码 · 独家童话</title>
  <style>
    @font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8dfd5;color:#654535;font-family:Fairy,'STFangsong','Songti SC',serif}button,input{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fffbf2;box-shadow:0 12px 32px #684a3425}.screen:before{content:'';position:absolute;inset:0;z-index:-2;background:url('../assets/m01-p05-source.webp') center/100% 100%;opacity:.04}.fairy{position:absolute;z-index:-1;top:0;left:0;right:0;height:39%;background:url('../assets/m01-p05-art.webp') left top/100cqw 211.72cqw no-repeat;-webkit-mask-image:linear-gradient(#000 93%,transparent);mask-image:linear-gradient(#000 93%,transparent)}.flowers{position:absolute;z-index:-1;bottom:0;left:0;right:0;height:17%;background:url('../assets/m01-p05-art.webp') center bottom/100cqw 211.72cqw no-repeat}.back{position:absolute;left:5.5%;top:4.3%;width:7cqw;height:7cqw;padding:0;border:0;background:transparent;color:#765441;cursor:pointer}.back svg{width:100%;height:100%;stroke:currentColor;stroke-width:2;fill:none}.title{position:absolute;top:37.7%;left:0;right:0;margin:0;text-align:center;font-size:9cqw;font-weight:400;letter-spacing:.05em}.subtitle{position:absolute;top:44.4%;left:0;right:0;margin:0;text-align:center;font-size:3.7cqw}.card{position:absolute;top:48.2%;left:8.6%;width:82.8%;height:38.3%;padding:5.6cqw 5.8cqw;border:.2cqw solid #ead6c8;border-radius:5.5cqw;background:#fffcf7ec;box-shadow:0 1cqw 2cqw #8f765322}.ornament{text-align:center;height:5cqw;color:#dfa8a0;font-size:3.3cqw}.field{display:block;margin:0 0 4.2cqw;font-size:3.9cqw}.field>span{display:block;margin:0 0 1.3cqw}.input-shell{display:flex;align-items:center;height:10.8cqw;padding:0 3.3cqw;border:.17cqw solid #e9cbbf;border-radius:3.5cqw;background:#fffdf9}.input-shell:focus-within{outline:.35cqw solid #e7a3ad}.input-shell input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#634c3f;font:3.8cqw Arial,'Microsoft YaHei',sans-serif}.input-shell input::placeholder{color:#b8a8a0}.eye{flex:none;border:0;background:transparent;color:#80614f;font:5cqw Arial;cursor:pointer}.hint{margin:-.1cqw 0 4cqw;color:#9d8777;font-size:3.3cqw}.hint b{color:#e3a7a8}.submit{width:100%;height:13.3cqw;border:.15cqw solid #e59ba4;border-radius:99cqw;background:#e9a5a8;color:#fff9f4;font-size:5.3cqw;letter-spacing:.08em;box-shadow:0 1cqw 1.6cqw #9c706333;cursor:pointer}.note{position:absolute;top:89.2%;left:0;right:0;margin:0;text-align:center;color:#9b806f;font-size:3.5cqw}.note b{color:#e2aaa2}.toast{position:absolute;left:10%;right:10%;bottom:5%;display:none;padding:2cqw;text-align:center;border-radius:2cqw;background:#654b3d;color:#fff;font-size:3cqw}.toast.show{display:block}@media(max-width:431px){body{display:block;background:#fffbf2}.screen{box-shadow:none}}
  </style>
</head>
<body>
  <main class="screen" aria-label="重设密码页">
    <div class="fairy" role="img" aria-label="携带金色钥匙的花仙子水彩插画"></div><div class="flowers" aria-hidden="true"></div>
    <button class="back" type="button" aria-label="返回找回密码" onclick="location.href='m01-p04.html'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-9 9 9 9M3 12h19"/></svg></button>
    <h1 class="title">换一把新钥匙</h1>
    <p class="subtitle">设置一个只属于你的登录密码</p>
    <form class="card" id="reset">
      <div class="ornament" aria-hidden="true">﹏✦﹏</div>
      <label class="field"><span>新密码</span><span class="input-shell"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="20" placeholder="输入新密码" required><button class="eye" type="button" data-target="password" aria-label="显示新密码">◎</button></span></label>
      <label class="field"><span>确认新密码</span><span class="input-shell"><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="20" placeholder="再次输入新密码" required><button class="eye" type="button" data-target="confirm" aria-label="显示确认密码">◎</button></span></label>
      <p class="hint"><b>★</b> 8-20 位，包含字母和数字</p>
      <button class="submit" type="submit">确认并重置</button>
    </form>
    <p class="note"><b>♥</b> 密码重置后需要重新登录</p>
    <p class="toast" id="toast" role="status"></p>
  </main>
  <script>
    const toast=document.querySelector('#toast');let timer;function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2600)}
    document.querySelectorAll('.eye').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.target);input.type=input.type==='password'?'text':'password';button.setAttribute('aria-label',input.type==='password'?'显示密码':'隐藏密码')}));
    document.querySelector('#reset').addEventListener('submit',event=>{event.preventDefault();const p=document.querySelector('#password').value,c=document.querySelector('#confirm').value;if(p!==c){show('两次输入的密码不一致');return}if(!/[A-Za-z]/.test(p)||!/[0-9]/.test(p)){show('密码需要包含字母和数字');return}show('这是设计稿演示，暂未连接密码重置接口。')});
  </script>
</body>
</html>

.stage{position:relative;isolation:isolate;width:min(100vw,862px);aspect-ratio:862/1825;margin:20px auto;container-type:inline-size;box-shadow:0 12px 35px #5b40332e;background:#fff9f3;overflow:hidden}.art,.source{position:absolute;inset:0;width:100%;height:100%;display:block}.art{display:none}.text-layer{position:absolute;display:block;width:max-content;max-width:98%;padding:0;font-family:Fairy,'STFangsong','Songti SC',serif;font-weight:400;line-height:1;white-space:nowrap;text-align:left;color:transparent;caret-color:#9c6157;background-color:transparent;background-repeat:no-repeat;border:0;outline:0;appearance:none;z-index:2}.text-layer.action{cursor:text}.stage.original .text-layer{display:none}.stage .text-layer:focus,.stage .text-layer:focus-within,.stage .text-layer.edited{color:var(--ink);background-image:url('../assets/m03-p11-art.webp')}.stage .text-layer:focus,.stage .text-layer:focus-within{outline:1px dashed #dd8e89}.stage.layered .source{display:none}.stage.layered .art{display:block}.stage.layered .text-layer{color:var(--ink);background-image:none}.stage.show-boxes .text-layer{outline:1px dashed #d9908b88}@media(max-width:862px){.stage{margin:0 auto;box-shadow:none}}

<script>
const stage=document.querySelector('#stage');const key='fairy-design-html:m03-p11';
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
document.querySelectorAll('.text-layer').forEach(layer=>{const edit=layer.querySelector('[contenteditable]')||layer;if(saved[layer.dataset.id]!==undefined){edit.textContent=saved[layer.dataset.id];layer.classList.add('edited')}edit.addEventListener('input',()=>{layer.classList.add('edited');saved[layer.dataset.id]=edit.textContent;localStorage.setItem(key,JSON.stringify(saved))})});
document.querySelector('#compare').addEventListener('click',event=>{stage.classList.toggle('original');if(stage.classList.contains('original'))stage.classList.remove('layered');event.currentTarget.textContent=stage.classList.contains('original')?'编辑文字层':'查看原稿';document.querySelector('#layers').textContent='查看分层重建'});
document.querySelector('#layers').addEventListener('click',event=>{stage.classList.remove('original');stage.classList.toggle('layered');document.querySelector('#compare').textContent='查看原稿';event.currentTarget.textContent=stage.classList.contains('layered')?'返回逐项编辑':'查看分层重建'});
document.querySelector('#boxes').addEventListener('click',()=>stage.classList.toggle('show-boxes'));
document.querySelector('#reset').addEventListener('click',()=>{localStorage.removeItem(key);location.reload()});
</script></body></html>

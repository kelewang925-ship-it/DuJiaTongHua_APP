<style>

</style></head><body><main class="screen" aria-label="我的创作"><div class="art-top" aria-hidden="true"></div><div class="art-cards" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><h1 class="title">我的创作</h1><p class="subtitle">独家记忆，只属于我们 ♡</p><button class="folder" aria-label="收藏夹" onclick="selectTab('漫画')"></button><div class="tabs" role="tablist" aria-label="创作分类"><button role="tab" aria-selected="true" data-tab="全部">全部</button><button role="tab" aria-selected="false" data-tab="漫画">漫画</button><button role="tab" aria-selected="false" data-tab="影片">影片</button><button role="tab" aria-selected="false" data-tab="草稿">草稿</button></div><button class="work comic" data-type="漫画" onclick="location.href='m05-p08.html'"><h2>海边的那天</h2><span class="saved">★ 已收藏</span><span class="tag">▤ 漫画</span></button><button class="work film" data-type="影片" onclick="location.href='m05-p05.html'"><h2>晚风里的告白</h2><span class="tag">▣ 影片</span></button><button class="work progress" data-type="漫画" onclick="location.href='m05-p06.html'"><span class="book-script">Our Memories</span><h2>正在把回忆<br>装订成册</h2><span class="percent">65%</span><span class="tag">▤ 制作中</span><span class="note">慢慢来，都是我们<br>最珍贵的时光 ♡</span></button><button class="work draft" data-type="草稿" onclick="location.href='m05-p03.html'"><h2>雨后的晚餐</h2><span class="tag">✎ 草稿</span><span class="edit">继续编辑 ›</span></button><p class="empty" id="empty">这里暂时没有作品</p><button class="start" onclick="location.href='m05-p01.html'">开始创作</button></main><script>function selectTab(value){document.querySelectorAll('.tabs button').forEach(item=>item.setAttribute('aria-selected',String(item.dataset.tab===value)));let visible=0;document.querySelectorAll('.work').forEach(item=>{const show=value==='全部'||item.dataset.type===value;item.hidden=!show;if(show)visible++});document.querySelector('#empty').style.display=visible?'none':'block'}document.querySelectorAll('.tabs button').forEach(item=>item.addEventListener('click',()=>selectTab(item.dataset.tab)));</script></body></html>

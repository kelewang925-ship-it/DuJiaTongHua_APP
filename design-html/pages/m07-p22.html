</style></head><body><main class="screen" aria-label="糯米的收藏图鉴"><div class="art-top" role="img" aria-label="糯米的装扮收藏"></div><div class="art-middle" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><h1 class="title">糯米的<br>收藏图鉴</h1><p class="subtitle">一起收集，每一件都有我们的故事 ♡</p><p class="count">已收藏 <strong>8</strong> / 20</p><div class="tabs" role="tablist" aria-label="收藏分类"><button role="tab" aria-selected="true" data-tab="装扮">装扮</button><button role="tab" aria-selected="false" data-tab="小屋">小屋</button><button role="tab" aria-selected="false" data-tab="纪念物">纪念物</button></div><div class="cards"><button type="button" data-name="小花围巾"><strong>小花围巾</strong><small>✓ 已拥有</small></button><button type="button" data-name="格纹蝴蝶结"><strong>格纹蝴蝶结</strong><small>✓ 已拥有</small></button><button type="button" data-name="星星领结"><strong>星星领结</strong><small>♥ 亲密度 160</small></button><button type="button" data-name="蜜桃帽子"><strong>蜜桃帽子</strong><small>🔒 成长故事解锁</small></button><button type="button" data-name="雨天小斗篷"><strong>雨天小斗篷</strong><small>▦ 连续照顾 7 天</small></button><button type="button" data-name="晚安铃铛"><strong>晚安铃铛</strong><small>🔒 未知</small></button></div><p class="next">下一件可解锁：<br>连续照顾 7 天</p><div class="toast" role="status"></div></main><script>const t=document.querySelector('.toast');const tell=s=>{t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='小屋'){location.href='m07-p15.html';return}if(b.dataset.tab==='纪念物'){location.href='m07-p21.html';return}document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'))});document.querySelectorAll('.cards button').forEach(b=>b.onclick=()=>tell(b.dataset.name+' · '+b.querySelector('small').textContent))</script></body></html>

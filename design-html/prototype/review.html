<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独家童话 · 原型评审工具</title><link rel="stylesheet" href="../assets/prototype-ui.css"><style>body{margin:0;background:#fff9ed;color:#583a26;font:16px/1.6 system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1{font-size:28px}section{padding:20px;margin:20px 0;border:1px solid #dfb99a;border-radius:12px;background:#fff4e3}label{display:flex;flex-direction:column;gap:8px;margin:14px 0}button,input,select{min-height:44px;padding:8px 12px;border:1px solid #dfb99a;border-radius:10px;background:#fff9ed;color:#583a26;font:inherit}button{cursor:pointer;margin:5px 8px 5px 0}a{color:#874c32}.status{white-space:pre-wrap}p{margin:8px 0}</style></head><body><main><h1>原型评审工具</h1><p>这些控件用于评审本地演示状态。设计稿页面保持正常产品流程。</p><nav><a href="../index.html">114页目录</a> · <a href="../pages/m03-p01.html">首页</a> · <a href="../pages/m06-p01.html">设置</a></nav><section><h2>日期</h2><p>用于验证纪念日当天和胶囊到期，不修改计算机时间。</p><label>演示今日<input type="date" id="today"></label><button id="apply-date">应用演示日期</button><button id="reset-date">使用本机日期</button></section><section><h2>另一半确认</h2><p class="status" id="pair-status"></p><button id="peer-accept">另一半同意解除</button><button id="peer-reject">另一半拒绝解除</button><a href="../pages/m06-p03.html">查看关联状态</a></section><section><h2>宠物领养确认</h2><p id="pet-status"></p><button id="pet-accept">另一半同意领养</button><button id="pet-reject">另一半拒绝领养</button><a href="../pages/m07-p03.html">宠物空间</a></section><section><h2>下一次失败</h2><label>失败操作<select id="operation"></select></label><button id="fail">应用一次失败</button><button id="clear-failure">恢复正常操作</button><p>设置后前往相应页面执行操作；失败后仍可继续重试。</p></section></main><script src="../assets/prototype-ui.js"></script><script src="../assets/prototype-dates.js"></script><script>
const UI=PrototypeUI,D=PrototypeDates,date=document.querySelector('#today');date.value=D.today().iso;
document.querySelector('#apply-date').onclick=()=>{if(!D.parse(date.value)){UI.toast('请选择有效日期','error');return;}sessionStorage.setItem('dujia-prototype-today',date.value);UI.toast('演示日期已应用','success');};
document.querySelector('#reset-date').onclick=()=>{sessionStorage.removeItem('dujia-prototype-today');date.value=D.today().iso;UI.toast('已使用本机日期','success');};
const pair=UI.read('dujia-prototype-relationship');document.querySelector('#pair-status').textContent=pair?.unlinkPending?'解除请求等待确认。':'当前没有待确认的解除请求。';
for(const[id,value]of[['peer-accept','accepted'],['peer-reject','rejected']]){const button=document.querySelector('#'+id);button.disabled=!pair?.unlinkPending;button.onclick=()=>{sessionStorage.setItem('dujia-prototype-peer-unlink',value);UI.go('../pages/m06-p03.html',{force:true});};}
const pet=UI.read('dujia-prototype-pet');document.querySelector('#pet-status').textContent=pet?.status==='pending'?'等待另一半确认领养 '+pet.name:'没有等待确认的领养邀请';for(const[id,value]of[['pet-accept','accepted'],['pet-reject','rejected']]){const button=document.querySelector('#'+id);button.disabled=pet?.status!=='pending';button.onclick=()=>{sessionStorage.setItem('dujia-prototype-peer-pet',value);UI.go('../pages/m07-p03.html',{force:true});};}
const operation=document.querySelector('#operation');for(const value of ['pet-load','pet-adopt','pet-confirm','pet-remind','pet-play','pet-feed','pet-water','pet-note','pet-claim','two-factor-verify','settings-profile','settings-avatar','settings-world','settings-unlink','settings-tag','settings-member','settings-preference','settings-backup','settings-export','settings-drafts-load','settings-phone','settings-two-factor','settings-account-delete','settings-feedback','settings-update','settings-logout','work-save','work-generate','work-album','work-characters','work-load','work-delete','anniversary-save','anniversary-toggle','anniversary-delete','anniversary-load','capsule-save','capsule-image','capsule-load','capsule-toggle','capsule-delete','capsule-open','capsule-collect','diary-save','diary-comment','photo-save','photo-image','moment-save','moment-comment','moment-load']){const option=document.createElement('option');option.value=value;option.textContent=value;operation.append(option);}
document.querySelector('#fail').onclick=()=>{sessionStorage.setItem('dujia-prototype-fail-next',operation.value);UI.toast('下次 '+operation.value+' 将演示失败');};document.querySelector('#clear-failure').onclick=()=>{sessionStorage.removeItem('dujia-prototype-fail-next');UI.toast('已恢复正常操作','success');};
</script></body></html>

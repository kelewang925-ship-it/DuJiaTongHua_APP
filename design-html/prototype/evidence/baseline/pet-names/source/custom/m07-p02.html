<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一起领养小伙伴 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#573312;font-family:Fairy,'STFangsong','Songti SC',serif}button,input{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-pets,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m07-p02-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:20%;background-position:left top}.art-pets{top:20%;height:51%;background-position:left -42.34cqw}.art-bottom{top:71%;height:29%;background-position:left -150.32cqw}.title{position:absolute;left:20%;top:7%;margin:0;font-size:9.5cqw;font-weight:400;white-space:nowrap}.subtitle{position:absolute;left:21%;top:15%;margin:0;font-size:4.3cqw;white-space:nowrap}.pets{position:absolute;left:7%;right:7%;top:21%;height:48%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.5%}.pet{position:relative;border:0;background:transparent;cursor:pointer;color:#55320f;font-size:5cqw}.pet span{position:absolute;left:25%;right:25%;bottom:2%;text-align:center}.name-label{position:absolute;left:22%;top:72%;margin:0;font-size:5cqw}.name{position:absolute;left:54%;top:71.5%;width:28%;border:0;background:transparent;color:#5a3413;text-align:center;font-size:6cqw;outline-color:#e49a77}.couple{position:absolute;top:82%;margin:0;font-size:4.4cqw}.c1{left:13%}.c2{right:10%}.invite{position:absolute;left:20%;top:89%;width:62%;height:6.5%;border:0;background:transparent;color:#fff;font-size:5.5cqw;cursor:pointer}.footnote{position:absolute;left:31%;top:96.5%;margin:0;color:#8f785c;font-size:3.3cqw;white-space:nowrap}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}

/* Original-design audit corrections. */
.title{font-weight:600;font-size:8.3cqw}.subtitle{font-size:3.7cqw}.pets{top:20.7%;height:49%;grid-template-rows:1.06fr 1fr;gap:1.2% 2.5%}.pet span{font-size:4.3cqw;bottom:5%}.name-label{font-size:4.4cqw;top:72.3%}.name{min-height:40px;top:70.5%;font-size:5cqw;border-radius:1cqw}.invite{min-height:40px;font-size:5cqw}.couple{font-size:3.8cqw}.screen .ui-icon{display:inline-block;vertical-align:middle;width:3.5cqw;height:3.5cqw}.toast{font-size:3.3cqw;line-height:1.4;overflow-wrap:anywhere}.pet{border:2px solid transparent;border-radius:3cqw;outline:0}
.screen button:focus-visible,.screen :is(.pet,.option,.item,.foods button,.cards button):focus-visible{outline:2px solid #a45f63;outline-offset:-3px}

/* Native choices: artwork is decorative; borders and ticks follow aria-pressed. */
.pets{background:var(--prototype-paper-warm);box-shadow:0 0 0 5px var(--prototype-paper-warm);border-radius:var(--prototype-radius-sm);isolation:isolate}
.pet{position:relative;isolation:isolate;background:var(--prototype-paper-warm);border:2px solid var(--prototype-border);border-radius:var(--prototype-radius-sm);outline:0}
.pet[aria-pressed=true]{border-color:var(--prototype-accent)}
.pet .choice-preview{position:absolute;z-index:-1;left:1.5cqw;right:1.5cqw;top:3cqw;bottom:8cqw;border-radius:4px;background-image:url('../assets/m07-p02-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw;pointer-events:none}
.pet:nth-child(1) .choice-preview{background-position:-8.5cqw -46.82cqw}
.pet:nth-child(2) .choice-preview{background-position:-52.57cqw -46.82cqw}
.pet:nth-child(3) .choice-preview{background-position:-8.5cqw -100.8cqw}
.pet:nth-child(4) .choice-preview{background-position:-52.57cqw -100.8cqw}
.pet:first-child .choice-preview{mask-image:radial-gradient(circle at calc(100% - 3.4cqw) 2.6cqw,transparent 4.3cqw,#000 calc(4.3cqw + 1px))}

.pet[aria-pressed=true] .selection-check{visibility:visible}
</style><link rel="stylesheet" href="../assets/ui-foundation.css"><link rel="stylesheet" href="../assets/prototype-ui.css"><link rel="stylesheet" href="../assets/prototype-pet.css"></head><body><main class="screen" aria-label="选择共同领养的小伙伴"><div class="art-top" aria-hidden="true"></div><div class="art-pets" role="img" aria-label="可选择的小狗、小猫、小兔和小狐狸插画"></div><div class="art-bottom" aria-hidden="true"></div><h1 class="title">一起领养小伙伴</h1><p class="subtitle">选一位陪我们写下故事的小伙伴</p><div class="pets" role="group" aria-label="选择宠物"><button class="pet" data-kind="小狗" aria-pressed="true"><i class="choice-preview" aria-hidden="true"></i><span>小狗</span><i class="selection-check" aria-hidden="true"></i></button><button class="pet" data-kind="小猫" aria-pressed="false"><i class="choice-preview" aria-hidden="true"></i><span>小猫</span><i class="selection-check" aria-hidden="true"></i></button><button class="pet" data-kind="小兔" aria-pressed="false"><i class="choice-preview" aria-hidden="true"></i><span>小兔</span><i class="selection-check" aria-hidden="true"></i></button><button class="pet" data-kind="小狐狸" aria-pressed="false"><i class="choice-preview" aria-hidden="true"></i><span>小狐狸</span><i class="selection-check" aria-hidden="true"></i></button></div><label class="name-label" for="pet-name">给它取个名字</label><input class="name" id="pet-name" value="糯米" maxlength="12"><p class="couple c1">小满</p><p class="couple c2">阿舟</p><button class="invite" id="invite">邀请 TA 一起领养</button><p class="footnote">以后也可以在图鉴中遇见新伙伴</p></main><script src="../assets/prototype-ui.js"></script><script src="../assets/prototype-records.js"></script><script src="../assets/prototype-preferences.js"></script><script src="../assets/prototype-dates.js"></script><script src="../assets/prototype-pet-store.js"></script><script src="../assets/prototype-pet.js"></script></body></html>

<body><main class="screen" aria-label="新建重要时刻">
<div class="cover-art" aria-hidden="true"></div>
<button class="back" type="button" aria-label="返回重要时刻"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg></button>
<h1 class="title">新建重要时刻</h1>
<button class="cover-button" id="cover-button" type="button" aria-label="添加封面"><img id="cover-preview" alt="封面预览"><span id="cover-label">添加封面</span></button>
<input class="file" id="cover-file" type="file" accept="image/*">
<form class="form" id="moment-form" method="dialog" novalidate onsubmit="event.preventDefault();window.PrototypeUI?.notReady(this)">
  <label class="field name"><span>时刻名称</span><input name="name" value="第一次旅行" maxlength="40" required></label>
  <label class="field date"><span>发生日期</span><input name="date" value="2024.06.18" inputmode="numeric" aria-label="发生日期"></label>
  <p class="type-heading">时刻类型</p>
  <div class="types" role="radiogroup" aria-label="时刻类型">
    <label><input type="radio" name="type" value="旅行" checked><span class="icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4m-9 0v14m10-14v14"/></svg></span>旅行</label>
    <label><input type="radio" name="type" value="第一次"><span class="icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7C2-3-3 11 12 21 27 11 22-3 12 7Z"/></svg></span>第一次</label>
    <label><input type="radio" name="type" value="节日"><span class="icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9m-7-4v13m0-13C3 8 5 0 9 3l3 5c9 0 7-8 3-5Z"/></svg></span>节日</label>
    <label><input type="radio" name="type" value="共同目标"><span class="icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>共同目标</label>
  </div>
  <label class="field story"><span>一句故事</span><textarea name="story" maxlength="200" placeholder="记录这个时刻背后的故事…"></textarea><small class="counter" id="counter">0/200</small></label>
  <p class="related-label">关联共同记录</p>
  <button class="related" type="button" id="related"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C9 3 5 3 3 4v16c4-1 6-1 9 1 3-2 5-2 9-1V4c-2-1-6-1-9 1Zm0 0v16"/></svg>从共同记录中选择<strong aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></strong></button>
  <button class="submit" type="submit">保存到时刻册</button>
</form><p class="toast" id="toast" role="status"></p>
</main>
<script src="../assets/prototype-ui.js"></script><script src="../assets/prototype-records.js"></script><script src="../assets/prototype-preferences.js"></script><script src="../assets/prototype-moment.js"></script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独家童话 · 共享组件</title><link rel="stylesheet" href="../assets/ui-foundation.css"><link rel="stylesheet" href="../assets/prototype-ui.css"><style>@font-face{font-family:Fairy;src:url('../assets/font.ttf')}*{box-sizing:border-box}body{margin:0;background:var(--prototype-paper);color:var(--prototype-ink);font:16px/1.6 Fairy,serif}main{max-width:431px;margin:auto;padding:16px 16px calc(24px + var(--ui-safe-bottom,0px))}.demo{margin:24px 0;padding:16px;border:1px solid var(--prototype-border);border-radius:12px}.demo>h2{margin:0 0 16px;font-size:20px;font-weight:400}.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;flex-wrap:wrap;gap:8px}p{overflow-wrap:anywhere}a{color:inherit}#saved{min-height:24px}</style></head><body><main><p><a class="ui-hit-text" href="review.html">返回原型评审</a> · 组件尺寸与状态</p><div id="header"></div><p>使用同一组原生 HTML 工厂和共享反馈组件。此页用于组件评审；实际业务页面按模块接入。</p><section class="demo"><h2>按钮</h2><div class="row" id="buttons"></div></section><section class="demo"><h2>表单</h2><div class="stack" id="fields"></div><p id="saved" role="status"></p></section><section class="demo"><h2>卡片与标签</h2><div class="stack" id="cards"></div></section><section class="demo"><h2>空数据与错误恢复</h2><div class="stack" id="states"></div></section><section class="demo"><h2>加载方式</h2><div class="stack" id="loading"></div></section><section class="demo"><h2>头像、分隔线</h2><div id="avatar"></div></section><section class="demo"><h2>共享反馈</h2><div class="stack" id="feedback"></div></section></main><script src="../assets/prototype-ui.js"></script><script>
const UI=PrototypeUI,C=UI.components,q=id=>document.getElementById(id);
q('header').append(C.header({title:'温柔一致的共享组件',onBack:()=>UI.back('review.html'),action:C.button('帮助',()=>UI.toast('这里展示实际共享组件'),{variant:'text'})}));
for(const [variant,label]of [['primary','主要操作'],['secondary','次要操作'],['text','文字操作'],['danger','危险操作']])q('buttons').append(C.button(label,()=>UI.toast('已点击'+label),{variant}));q('buttons').append(C.button('不可用',null,{disabled:true}),C.button('♡',()=>UI.toast('已点击图标'),{variant:'icon',name:'收藏图标'}));
const nickname=C.field({label:'昵称',name:'nickname',maxLength:12,placeholder:'最多12个字'}),body=C.field({label:'今天的小心情',name:'body',multiline:true,maxLength:500,placeholder:'在这里写下心情'}),disabled=C.field({label:'暂时不可编辑',value:'等待资料加载',disabled:true});
nickname.input.onblur=()=>nickname.setError(nickname.input.value.trim()?'':'请填写昵称');
const save=C.button('演示保存',()=>{if(!nickname.setError(nickname.input.value.trim()?'':'请填写昵称')){nickname.input.focus();return;}const value=nickname.input.value.trim();UI.busy(save,'保存中…',async()=>{q('saved').textContent='已保存：'+value;UI.toast('已保存','success');return true;});});q('fields').append(nickname.root,body.root,disabled.root,save);
q('cards').append(C.card({title:'一张有行动的卡片',message:'点击后显示已选择的状态',selected:false,onClick:event=>event.currentTarget.setAttribute('aria-pressed',String(event.currentTarget.getAttribute('aria-pressed')!=='true'))}),C.card({title:'普通信息卡',message:'静态卡片不提供点击反馈'}),C.tag({label:'旅行标签'}),C.tag({label:'不可选标签',disabled:true}));
const recovery=document.createElement('div');recovery.append(C.state({kind:'error',title:'暂时加载失败',message:'内容尚未加载，重试后继续。',action:'重新加载',onAction:()=>{recovery.replaceChildren(C.loading({mode:'skeleton',label:'重新加载中…'}));setTimeout(()=>recovery.replaceChildren(C.card({title:'重新加载成功',message:'现在可以继续浏览内容'})),550);}}));q('states').append(C.state({title:'这里还没有故事',message:'从第一篇日记开始记录今天。',action:'写第一篇日记',onAction:()=>UI.go('../pages/m03-p05.html')}),recovery);
q('loading').append(C.loading({mode:'skeleton',label:'列表加载中…'}),C.loading({mode:'spinner',label:'读取资料中…'}),C.loading({mode:'progress',label:'生成进度',value:60}));q('avatar').append(C.avatar({name:'星星'}),C.divider());
q('feedback').append(C.button('确认弹窗',()=>UI.modal({title:'确认这次操作？',message:'取消不会执行操作。',confirm:'确认',cancel:'取消'}).then(ok=>ok&&UI.toast('已确认'))),C.button('底部选择器',()=>UI.sheet({title:'选择标签',actions:[{label:'旅行',value:'travel'},{label:'日常',value:'daily'}]}).then(value=>value&&UI.toast('已选择'+(value==='travel'?'旅行':'日常')))),C.button('成功提示',()=>UI.toast('已保存','success')),C.button('错误提示',()=>UI.toast('操作失败，请重试','error')));
</script></body></html>

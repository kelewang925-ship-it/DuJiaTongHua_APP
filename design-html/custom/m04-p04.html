<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新建重要时刻 · 独家童话</title>
<style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8dfd5;color:#4b2e1f;font-family:Fairy,'STFangsong','Songti SC',serif}button,input,textarea{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fffcf4;box-shadow:0 12px 32px #684a3425}.cover-art{position:absolute;left:0;top:8.5%;width:100%;height:32%;background:url('../assets/m04-p04-art.webp') left -18cqw/100cqw 211.72cqw no-repeat}.cover-button{position:absolute;left:5%;top:8.5%;width:90%;height:31.5%;border:0;background:transparent;cursor:pointer}.cover-button span{display:block;position:absolute;top:60%;left:0;right:0;text-align:center;font-size:4.4cqw;color:#71543e}.cover-button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;border-radius:2cqw}.file{display:none}.back{position:absolute;top:2.7%;left:4%;border:0;background:transparent;color:#51321e;font:7cqw Arial;cursor:pointer}.title{position:absolute;top:2.8%;left:0;right:0;margin:0;text-align:center;font-size:6cqw;font-weight:400;letter-spacing:.08em;pointer-events:none}.form{position:absolute;inset:0;pointer-events:none}.form>*{pointer-events:auto}.field{position:absolute;left:5%;width:90%}.field span,.type-heading{display:block;margin-bottom:1.7cqw;font-size:4.3cqw}.field input,.field textarea{width:100%;border:.2cqw solid #d8c9b7;border-radius:2.3cqw;background:#ffffff91;outline-color:#d99474;color:#4b2e1f;font-size:4.2cqw}.name{top:42%}.name input,.date input{height:10cqw;padding:0 2.5cqw}.date{top:52%}.type-heading{position:absolute;left:5%;top:62%;margin:0}.types{position:absolute;left:5%;right:5%;top:66%;display:flex;gap:1.8cqw}.types label{flex:1;min-width:0;height:9cqw;display:flex;align-items:center;justify-content:center;gap:.8cqw;border:.2cqw solid #decfc0;border-radius:99cqw;background:#fffbf4;white-space:nowrap;font-size:3.4cqw;cursor:pointer}.types label:has(input:checked){border-color:#d38b67;background:#fff4ea}.types input{position:absolute;opacity:0;pointer-events:none}.types .icon{font:5cqw Arial}.story{top:72%}.story textarea{height:17cqw;padding:2.5cqw;resize:none}.story textarea::placeholder{color:#ad9e90}.counter{position:absolute;right:2.5cqw;bottom:.7cqw;color:#b0a292;font-size:3cqw}.related{position:absolute;left:5%;right:5%;top:85.5%;height:5%;border:.2cqw dashed #d9a887;border-radius:2cqw;background:#fffefa;color:#5b3d2c;text-align:left;padding:0 3cqw;font-size:3.8cqw;cursor:pointer}.related b{margin-right:3cqw;color:#d59370;font-size:5cqw}.related strong{float:right;font:5cqw Arial}.submit{position:absolute;left:5%;right:5%;top:93.5%;height:4.8%;border:0;border-radius:1.5cqw;background:#f39d7d;color:white;font-size:4.7cqw;cursor:pointer}.toast{position:absolute;left:12%;right:12%;bottom:8%;display:none;padding:2cqw;border-radius:2cqw;background:#624535;color:#fff;text-align:center;font-size:3cqw}.toast.show{display:block}@media(max-width:431px){body{display:block;background:#fffcf4}.screen{box-shadow:none}}
.related-label{position:absolute;left:5%;top:83.4%;margin:0;font-size:4.2cqw;color:#472a17}</style>
</head>
<body><main class="screen" aria-label="新建重要时刻">
<div class="cover-art" aria-hidden="true"></div>
<button class="back" type="button" aria-label="返回重要时刻" onclick="location.href='m04-p01.html'">←</button>
<h1 class="title">新建重要时刻</h1>
<button class="cover-button" id="cover-button" type="button" aria-label="添加封面"><img id="cover-preview" alt="封面预览"><span id="cover-label">添加封面</span></button>
<input class="file" id="cover-file" type="file" accept="image/*">
<form class="form" id="moment-form">
  <label class="field name"><span>时刻名称</span><input name="name" value="第一次旅行" maxlength="40" required></label>
  <label class="field date"><span>发生日期</span><input name="date" value="2024.06.18" inputmode="numeric" aria-label="发生日期"></label>
  <p class="type-heading">时刻类型</p>
  <div class="types" role="radiogroup" aria-label="时刻类型">
    <label><input type="radio" name="type" value="旅行" checked><span class="icon">♧</span>旅行</label>
    <label><input type="radio" name="type" value="第一次"><span class="icon">♡</span>第一次</label>
    <label><input type="radio" name="type" value="节日"><span class="icon">♧</span>节日</label>
    <label><input type="radio" name="type" value="共同目标"><span class="icon">⊙</span>共同目标</label>
  </div>
  <label class="field story"><span>一句故事</span><textarea name="story" maxlength="200" placeholder="记录这个时刻背后的故事…"></textarea><small class="counter" id="counter">0/200</small></label>
  <p class="related-label">关联共同记录</p>
  <button class="related" type="button" id="related"><b>▣</b>从共同记录中选择<strong>›</strong></button>
  <button class="submit" type="submit">保存到时刻册</button>
</form><p class="toast" id="toast" role="status"></p>
</main>
<script>
const form=document.querySelector('#moment-form'),story=form.elements.story,toast=document.querySelector('#toast');let timer;function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2600)}story.addEventListener('input',()=>document.querySelector('#counter').textContent=story.value.length+'/200');document.querySelector('#cover-button').addEventListener('click',()=>document.querySelector('#cover-file').click());document.querySelector('#cover-file').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;const image=document.querySelector('#cover-preview');image.src=URL.createObjectURL(file);image.style.display='block';document.querySelector('#cover-label').style.display='none'});document.querySelector('#related').addEventListener('click',()=>show('请从共同日记和相册中选择关联记录'));form.addEventListener('submit',event=>{event.preventDefault();localStorage.setItem('dujia-moment-draft',JSON.stringify(Object.fromEntries(new FormData(form))));show('重要时刻已保存到当前浏览器')});
</script></body></html>

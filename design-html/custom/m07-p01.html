<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>等待 TA 的确认 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#59320f;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-hero,.art-cards,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m07-p01-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-hero{top:0;height:49%;background-position:left top}.art-cards{top:49%;height:31%;background-position:left -103.74cqw}.art-bottom{top:80%;height:20%;background-position:left -169.37cqw}.title{position:absolute;left:18%;top:5.5%;margin:0;font-size:10cqw;font-weight:400;white-space:nowrap}.subtitle{position:absolute;left:22%;top:13%;margin:0;font-size:4.4cqw;color:#dd8068;white-space:nowrap}.dog-name{position:absolute;left:58%;top:22.5%;font-size:4cqw}.note{position:absolute;left:62%;top:37.5%;width:24%;margin:0;font-size:3.2cqw;line-height:1.5;transform:rotate(5deg)}.card{position:absolute;left:35%;right:12%;margin:0;font-size:5.5cqw;line-height:1.4}.agreed{top:53%}.agreed small{font-size:4.8cqw}.waiting{top:68%}.waiting strong{color:#e18469;font-weight:400}.waiting small{font-size:3.7cqw}.remind{position:absolute;left:18%;top:81%;width:68%;height:7%;padding-left:13%;border:0;background:transparent;color:#d47156;font-size:5.4cqw;cursor:pointer}.hint{position:absolute;left:21%;top:90%;margin:0;font-size:4cqw;white-space:nowrap}.return{position:absolute;left:42%;top:96%;border:0;background:transparent;color:#76604a;font-size:3.8cqw;text-decoration:underline;cursor:pointer}.toast{position:absolute;left:20%;right:20%;bottom:16%;display:none;padding:2cqw;background:#604837;color:#fff;border-radius:2cqw;text-align:center;font-size:3cqw}.toast.show{display:block}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="等待另一半确认共同领养"><div class="art-hero" role="img" aria-label="糯米和小屋插画"></div><div class="art-cards" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><h1 class="title">等待 TA 的确认</h1><p class="subtitle">糯米已经在小屋里等我们啦 ♡</p><span class="dog-name">糯米 ♡</span><p class="note">欢迎回家，<br>我们一起照顾<br>糯米吧！</p><p class="card agreed">我已同意领养<br><small>小满</small></p><p class="card waiting">等待 <strong>阿舟</strong> 确认<br><small>✉ 已向 TA 发出邀请</small></p><button class="remind" id="remind">提醒 TA 看看 ›</button><p class="hint">TA 确认后，你们就可以一起照顾糯米</p><button class="return" onclick="location.href='m03-p01.html'">暂时返回</button><p class="toast" id="toast" role="status"></p></main><script>try{const pet=JSON.parse(localStorage.getItem('dujia-pet'));if(pet?.name){document.querySelector('.dog-name').textContent=pet.name+' ♡';document.querySelector('.subtitle').textContent=pet.name+'已经在小屋里等我们啦 ♡';document.querySelector('.hint').textContent='TA 确认后，你们就可以一起照顾'+pet.name;document.querySelector('.note').innerHTML='欢迎回家，<br>我们一起照顾<br>'+pet.name+'吧！'}}catch{}document.querySelector('#remind').addEventListener('click',()=>{const toast=document.querySelector('#toast');toast.textContent='已提醒阿舟查看领养邀请';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)});</script></body></html>

</style><link rel="stylesheet" href="../assets/ui-foundation.css"></head><body><main class="screen" aria-label="数据与存储"><div class="art-top" role="img" aria-label="装满共同回忆的收纳箱插画"></div><div class="art-list" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回设置" onclick="location.href='m06-p07.html'"><svg class="ui-icon" viewBox="-2 -2 28 28" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg></button><h1 class="title">数据与存储</h1><p class="used">已使用</p><p class="quantity">1.2 GB <small>/ 5 GB</small></p><button class="row export" id="export">导出我的记录</button><button class="row backup" id="backup">共同记录备份</button><div class="row automatic">自动备份</div><button class="switch" id="auto" role="switch" aria-label="自动备份" aria-checked="true"></button><button class="row manage" onclick="notify('存储空间：1.2 GB / 5 GB')">存储空间管理</button><button class="row cache" id="cache">清理缓存 <span>128 MB</span></button><p class="note">导出文件只包含你有权限查看的内容</p><p class="toast" id="toast" role="status"></p></main><script>function notify(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}const auto=document.querySelector('#auto');auto.setAttribute('aria-checked',localStorage.getItem('dujia-auto-backup')??'true');auto.addEventListener('click',()=>{const value=auto.getAttribute('aria-checked')!=='true';auto.setAttribute('aria-checked',String(value));localStorage.setItem('dujia-auto-backup',String(value))});document.querySelector('#backup').addEventListener('click',()=>{localStorage.setItem('dujia-last-backup',new Date().toISOString());notify('共同记录备份已创建')});document.querySelector('#export').addEventListener('click',()=>{const data={profile:localStorage.getItem('dujia-profile'),privacy:localStorage.getItem('dujia-privacy'),notifications:localStorage.getItem('dujia-notifications')};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,

</style><link rel="stylesheet" href="../assets/ui-foundation.css"></head><body><main class="screen" aria-label="新建时光胶囊"><div class="art-top" role="img" aria-label="装着纸条的玻璃胶囊瓶"></div><div class="art-form" aria-hidden="true"></div><button class="back" type="button" aria-label="返回胶囊列表" onclick="location.href='m04-p12.html'"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg></button><h1 class="title">新建时光胶囊</h1><form class="form" id="capsule-form"><label class="field-label title-label" for="name">胶囊标题</label><input class="name" id="name" name="name" value="写给一周年的我们" maxlength="40" required><label class="field-label words-label" for="message">想要留下的话</label><textarea class="message" id="message" name="message">愿我们在未来的日子里，&#10;依然心怀热爱，彼此陪伴。&#10;记得今天的约定，&#10;也记得当时心动的瞬间。</textarea><label class="field-label photo-label" for="photo">添加照片</label><button class="add-photo" type="button" aria-label="添加照片" onclick="document.querySelector('#photo').click()"></button><input class="file" id="photo" type="file" accept="image/*" multiple><p class="chosen" id="chosen"></p><label class="field-label time-label" for="opening">开启时间</label><input class="opening" id="opening" name="opening" value="2026 年 9 月 12 日"><label class="field-label reminder-label" for="reminder">开启提醒</label><input class="repeat" id="reminder" name="reminder" type="checkbox" checked aria-label="开启提醒"><div class="actions"><button type="button" id="draft">暂存草稿</button><button type="submit">封存这份心意</button></div></form><p class="toast" id="toast" role="status"></p></main><script>const form=document.querySelector('#capsule-form'),toast=document.querySelector('#toast');function show(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600)}document.querySelector('#photo').addEventListener('change',event=>{document.querySelector('#chosen').textContent=event.target.files.length+' 张照片已选择'});function save(status){localStorage.setItem('dujia-capsule-draft',JSON.stringify({...Object.fromEntries(new FormData(form)),status}));show(status==='sealed'?'心意已保存在当前浏览器':'草稿已保存在当前浏览器')}document.querySelector('#draft').addEventListener('click',()=>save('draft'));form.addEventListener('submit',event=>{event.preventDefault();save('sealed')});</script></body></html>

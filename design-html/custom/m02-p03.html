</style><link rel="stylesheet" href="../assets/ui-foundation.css"></head><body><main class="screen" aria-label="输入邀请码页"><div class="bird" role="img" aria-label="携带邀请信的水彩小鸟"></div><div class="flowers" aria-hidden="true"></div><button class="back" type="button" onclick="location.href='m02-p01.html'"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg><span>返回</span></button><h1 class="title">收到一封特别邀请</h1><p class="subtitle">输入 TA 分享给你的邀请码</p><div class="ornament" aria-hidden="true">·—◦♥◦—·</div><form id="invite"><div class="code" aria-label="四位邀请码"><input aria-label="第 1 位邀请码" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" value="X" required><input aria-label="第 2 位邀请码" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" value="H" required><input aria-label="第 3 位邀请码" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" value="7" required><input aria-label="第 4 位邀请码" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" value="K" required></div><p class="case">邀请码不区分大小写</p><p class="error" id="error">请填写完整的邀请码</p><button class="preview" type="submit">查看邀请内容</button></form><p class="later">没有邀请码？ <a class="ui-hit-text" href="m02-p01.html">请让 TA 分享给你</a></p></main><script>const inputs=[...document.querySelectorAll('.code input')];inputs.forEach((input,index)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/[^a-z0-9]/gi,'').slice(0,1).toUpperCase();if(input.value&&index<3)inputs[index+1].focus()});input.addEventListener('keydown',event=>{if(event.key==='Backspace'&&!input.value&&index>0)inputs[index-1].focus()});input.addEventListener('paste',event=>{event.preventDefault();[...event.clipboardData.getData('text').replace(/[^a-z0-9]/gi,'').slice(0,4).toUpperCase()].forEach((char,i)=>inputs[i].value=char)})});document.querySelector('#invite').addEventListener('submit',event=>{event.preventDefaul

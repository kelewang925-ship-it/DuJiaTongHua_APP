<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>验证码 · 独家童话</title>
<style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8dfd5;color:#694737;font-family:Fairy,'STFangsong','Songti SC',serif}button,input{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fffbf2;box-shadow:0 12px 32px #684a3425}.screen:before{content:'';position:absolute;inset:0;z-index:-2;background:url('../assets/m01-p07-source.webp') center/100% 100%;opacity:.045}.bird{position:absolute;top:8%;left:0;right:0;height:25%;z-index:-1;background:url('../assets/m01-p07-source.webp') center/100cqw 211.72cqw no-repeat;background-position:center -17cqw;-webkit-mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent)}.back{position:absolute;left:6%;top:4.3%;border:0;background:transparent;color:#664839;font-size:4.5cqw;cursor:pointer}.title{position:absolute;left:0;right:0;top:34.2%;margin:0;text-align:center;font-size:10.2cqw;font-weight:400;letter-spacing:.03em}.subtitle{position:absolute;left:0;right:0;top:42%;margin:0;text-align:center;font-size:3.9cqw}.code{position:absolute;left:5.8%;top:49.6%;width:88.4%;height:8.8%;display:flex;gap:1.9cqw}.code input{width:0;min-width:0;flex:1;text-align:center;border:.25cqw solid #e7afa7;border-radius:2cqw;outline:0;background:#fffdf7;color:#684536;font:10cqw Arial,sans-serif}.code input:focus{border-color:#d98689;box-shadow:0 0 0 .4cqw #f1cbca}.hint{position:absolute;left:0;right:0;top:62%;margin:0;text-align:center;font-size:3.9cqw}.hint b,.timer b{color:#d9878c;font-weight:400}.verify{position:absolute;left:12.8%;top:67.6%;width:74.4%;height:7.8%;border:0;border-radius:6cqw;background:#efa9a2;color:#fffaf4;font-size:5.5cqw;letter-spacing:.1em;cursor:pointer}.timer{position:absolute;left:0;right:0;top:78.3%;margin:0;text-align:center;font-size:4cqw}.resend{border:0;background:transparent;color:#d9878c;cursor:pointer}.switch{position:absolute;left:0;right:0;top:86.3%;margin:0;text-align:center}.switch button{padding:0;border:0;border-bottom:.2cqw solid #d9878c;background:transparent;color:#d9878c;font-size:4cqw;cursor:pointer}.toast{position:absolute;left:10%;right:10%;bottom:6%;display:none;padding:2cqw;text-align:center;border-radius:2cqw;background:#684c3e;color:#fff;font-size:3cqw}.toast.show{display:block}@media(max-width:431px){body{display:block;background:#fffbf2}.screen{box-shadow:none}}
.screen:before{display:none}</style></head>
<body><main class="screen" aria-label="验证码确认页"><div class="bird" role="img" aria-label="携带粉色信封的蓝色小鸟水彩插画"></div><button class="back" type="button" onclick="history.back()">← 返回</button><h1 class="title">信已经送出啦</h1><p class="subtitle">验证码已发送至 138 1234 5678</p><form id="verify-form"><div class="code" aria-label="六位验证码"><input aria-label="第 1 位验证码" inputmode="numeric" maxlength="1" value="2"><input aria-label="第 2 位验证码" inputmode="numeric" maxlength="1" value="8"><input aria-label="第 3 位验证码" inputmode="numeric" maxlength="1" value="4"><input aria-label="第 4 位验证码" inputmode="numeric" maxlength="1"><input aria-label="第 5 位验证码" inputmode="numeric" maxlength="1"><input aria-label="第 6 位验证码" inputmode="numeric" maxlength="1"></div><p class="hint">请在 <b>10</b> 分钟内完成验证</p><button class="verify" type="submit">验证并继续</button></form><p class="timer"><button class="resend" id="resend" type="button"><b id="seconds">48</b> 秒后可重新获取</button></p><p class="switch"><button type="button" id="switch">没收到验证码？换个方式</button></p><p class="toast" id="toast" role="status"></p></main>
<script>const inputs=[...document.querySelectorAll('.code input')],toast=document.querySelector('#toast');let toastTimer,seconds=48;function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2500)}inputs.forEach((input,index)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,1);if(input.value&&index<5)inputs[index+1].focus()});input.addEventListener('keydown',event=>{if(event.key==='Backspace'&&!input.value&&index>0)inputs[index-1].focus()});input.addEventListener('paste',event=>{event.preventDefault();const digits=event.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);[...digits].forEach((digit,i)=>{if(inputs[i])inputs[i].value=digit});inputs[Math.min(digits.length,5)].focus()})});setInterval(()=>{if(seconds>0){seconds--;document.querySelector('#seconds').textContent=seconds}else document.querySelector('#resend').textContent='重新获取验证码'},1000);document.querySelector('#resend').addEventListener('click',()=>show(seconds?'请等待倒计时结束':'这是设计稿演示，暂未发送验证码。'));document.querySelector('#switch').addEventListener('click',()=>show('其他验证方式尚未接入。'));document.querySelector('#verify-form').addEventListener('submit',event=>{event.preventDefault();show(inputs.every(input=>input.value)?'这是设计稿演示，暂未连接验证码接口。':'请输入完整的六位验证码')});</script></body></html>

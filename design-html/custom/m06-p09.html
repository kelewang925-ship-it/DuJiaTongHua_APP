<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐私与共同可见 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#633b22;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-settings,.art-foot{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m06-p09-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:37%;background-position:left top}.art-settings{top:37%;height:49%;background-position:left -78.34cqw}.art-foot{top:86%;height:14%;background-position:left -182.08cqw}.back{position:absolute;left:2%;top:2%;width:12%;height:7%;border:0;background:transparent;cursor:pointer}.title{position:absolute;left:25%;top:2.5%;margin:0;font-weight:400;font-size:7cqw;white-space:nowrap}.scope{position:absolute;left:20%;right:12%;top:37.5%;height:7%;border:0;background:transparent;text-align:left;color:#58381f;font-size:5cqw;cursor:pointer}.scope span{float:right;color:#9e6143}.row{position:absolute;left:20%;right:17%;height:8%;color:#59371e}.row strong{display:block;font-size:5cqw;font-weight:400}.row small{display:block;color:#9a8776;font-size:3.8cqw}.r1{top:47.5%}.r2{top:57.5%}.r3{top:67.5%}.r4{top:77.5%}.switch{position:absolute;left:78%;width:13%;height:4%;border:0;border-radius:20cqw;background:transparent;cursor:pointer}.switch[aria-checked=false]{background:#d5cbc0}.switch[aria-checked=false]::after{content:'';position:absolute;left:5%;top:6%;width:55%;height:88%;border-radius:50%;background:#fff;box-shadow:0 .2cqw .7cqw #6f4b3940}.s1{top:49.2%}.s2{top:59.2%}.s3{top:69.2%}.s4{top:79.2%}.note{position:absolute;left:27%;top:91%;width:57%;margin:0;font-size:4.2cqw;text-align:center;transform:rotate(-3deg)}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="隐私与共同可见"><div class="art-top" role="img" aria-label="带心形锁扣的回忆册插画"></div><div class="art-settings" aria-hidden="true"></div><div class="art-foot" aria-hidden="true"></div><button class="back" aria-label="返回设置" onclick="location.href='m06-p07.html'"></button><h1 class="title">隐私与共同可见</h1><button class="scope" id="scope">默认可见范围 <span>仅自己可见</span></button><div class="row r1"><strong>共同可见</strong><small>邀请另一半一起查看</small></div><button class="switch s1" role="switch" aria-label="共同可见" aria-checked="true" data-key="shared"></button><div class="row r2"><strong>共同空间</strong><small>管理你们的共享资料</small></div><button class="switch s2" role="switch" aria-label="共同空间" aria-checked="true" data-key="space"></button><div class="row r3"><strong>另一半回应</strong><small>允许 TA 在共同记录下留下回应</small></div><button class="switch s3" role="switch" aria-label="另一半回应" aria-checked="true" data-key="replies"></button><div class="row r4"><strong>相关提醒</strong><small>收到回应时提醒我</small></div><button class="switch s4" role="switch" aria-label="相关提醒" aria-checked="true" data-key="reminders"></button><p class="note">共同可见只属于你们两个人</p></main><script>const key='dujia-privacy';let settings={scope:'仅自己可见',shared:true,space:true,replies:true,reminders:true};try{settings={...settings,...JSON.parse(localStorage.getItem(key))}}catch{}function render(){document.querySelector('#scope span').textContent=settings.scope;document.querySelectorAll('.switch').forEach(button=>button.setAttribute('aria-checked',String(settings[button.dataset.key])))}function save(){localStorage.setItem(key,JSON.stringify(settings));render()}document.querySelector('#scope').addEventListener('click',()=>{settings.scope=settings.scope==='仅自己可见'?'共同可见':'仅自己可见';save()});document.querySelectorAll('.switch').forEach(button=>button.addEventListener('click',()=>{settings[button.dataset.key]=!settings[button.dataset.key];save()}));render();</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择回忆册主题 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#603a1e;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-middle,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m08-p05-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:67%;background-position:left top}.art-middle{top:67%;height:24%;background-position:left -141.85cqw}.art-bottom{top:91%;height:9%;background-position:left -192.67cqw}h1,h2,p{position:absolute;margin:0;font-weight:400}.back{position:absolute;left:4%;top:2%;width:9%;height:5%;border:0;background:transparent;cursor:pointer}.brand{top:2%;left:40%;font-size:5cqw}.subbrand{top:6.2%;left:40%;font-size:3.8cqw;color:#fff}.steps{position:absolute;top:13.5%;left:14%;right:14%;display:flex;justify-content:space-between;font-size:3cqw}.title{top:16.8%;left:21%;font-size:7.7cqw}.cover-name{top:27%;left:33%;font-size:8cqw}.themes-label{top:65.7%;left:6%;font-size:3.7cqw}.themes{position:absolute;left:5%;right:5%;top:68%;height:12%;display:grid;grid-template-columns:repeat(3,1fr);gap:2%}.themes button{border:0;background:transparent;color:#603a1e;font-size:3.6cqw;padding-top:18cqw;cursor:pointer}.themes button[aria-pressed=true]{color:#c66a53}.photo-label{top:82.4%;left:6%;font-size:3.8cqw}.photo-copy{top:86%;left:34%;font-size:3.2cqw}.photo-help{top:88%;left:34%;font-size:2.7cqw;color:#aa9886}.toggle{position:absolute;left:75%;top:86%;width:10%;height:3%;border:0;border-radius:999px;background:transparent;cursor:pointer}.toggle[aria-checked=false]{background:#ada29c88}.toggle[aria-checked=false]:after{content:'';position:absolute;left:4%;top:11%;height:78%;aspect-ratio:1;border-radius:50%;background:#fff}.next{position:absolute;left:20%;top:93%;width:61%;height:5%;border:0;background:transparent;color:#fff;font-size:5.2cqw;cursor:pointer}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="为回忆册选择主题"><div class="art-top" role="img" aria-label="以夕阳为封面的手工回忆册"></div><div class="art-middle" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回上一步" onclick="location.href='m08-p04.html'"></button><p class="brand">独家童话</p><p class="subbrand">共同回忆册</p><p class="steps">封面　　主题　　素材　　排版　　完成</p><h1 class="title">为这本书挑一件外衣</h1><h2 class="cover-name" id="coverName">我们的夏天 ♡</h2><p class="themes-label">选择主题 ♡</p><div class="themes"><button type="button" aria-pressed="true" data-theme="花园午后">花园午后</button><button type="button" aria-pressed="false" data-theme="旅行手札">旅行手札</button><button type="button" aria-pressed="false" data-theme="暖灯日常">暖灯日常</button></div><p class="photo-label">封面照片（可选）</p><p class="photo-copy">使用这张照片作为封面局部装饰</p><p class="photo-help">可在封面上展示为小相片装饰元素</p><button class="toggle" role="switch" aria-label="使用封面照片" aria-checked="true"></button><button class="next" type="button">下一步：选择素材</button></main><script>
try{const d=JSON.parse(localStorage.getItem('fairy-memory-draft')||'{}');if(d.name)document.getElementById('coverName').textContent=d.name+' ♡'}catch{}document.querySelectorAll('.themes button').forEach(b=>b.onclick=()=>document.querySelectorAll('.themes button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')));const toggle=document.querySelector('.toggle');toggle.onclick=()=>toggle.setAttribute('aria-checked',toggle.getAttribute('aria-checked')==='true'?'false':'true');document.querySelector('.next').onclick=()=>{localStorage.setItem('fairy-memory-theme',document.querySelector('.themes button[aria-pressed=true]').dataset.theme);localStorage.setItem('fairy-memory-cover-photo',toggle.getAttribute('aria-checked'));location.href='m08-p06.html'};
</script></body></html>

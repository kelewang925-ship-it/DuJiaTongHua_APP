<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#694025;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-hero,.art-list,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m06-p07-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-hero{top:0;height:41%;background-position:left top}.art-list{top:41%;height:49%;background-position:left -86.81cqw}.art-bottom{top:90%;height:10%;background-position:left -190.55cqw}.back{position:absolute;left:2%;top:3%;width:12%;height:7%;border:0;background:transparent;cursor:pointer}.title{position:absolute;left:15%;top:3%;margin:0;font-size:10cqw;font-weight:400;color:#b7542e}.row{position:absolute;left:6%;right:7%;height:7%;border:0;background:transparent;text-align:left;padding-left:20%;font-size:5.4cqw;color:#68401f;cursor:pointer}.security{top:41%}.privacy{top:49%}.notifications{top:57%}.storage{top:65%}.general{position:absolute;left:12%;top:71%;margin:0;font-size:5cqw;font-weight:400}.display{top:76%}.language{top:84%}.logout{position:absolute;left:16%;right:17%;top:92%;height:6%;border:0;background:transparent;color:#ae522d;font-size:6cqw;cursor:pointer}.toast{position:absolute;left:18%;right:18%;bottom:13%;display:none;padding:2cqw;border-radius:2cqw;background:#644533;color:#fff;text-align:center;font-size:3cqw}.toast.show{display:block}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="设置"><div class="art-hero" role="img" aria-label="手帐夹和爱心齿轮插画"></div><div class="art-list" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回我的与设置" onclick="location.href='m06-p01.html'"></button><h1 class="title">设置</h1><button class="row security" onclick="location.href='m06-p08.html'">账号与安全</button><button class="row privacy" onclick="location.href='m06-p09.html'">隐私与共同可见</button><button class="row notifications" onclick="location.href='m06-p10.html'">通知设置</button><button class="row storage" onclick="location.href='m06-p11.html'">数据与存储</button><h2 class="general">通用</h2><button class="row display" onclick="notify('当前使用原稿的温暖手帐外观')">显示与外观</button><button class="row language" onclick="notify('当前语言：简体中文')">语言</button><button class="logout" onclick="if(confirm('退出当前登录？'))location.href='m01-p01.html'">退出登录</button><p class="toast" id="toast" role="status"></p></main><script>function notify(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}</script></body></html>

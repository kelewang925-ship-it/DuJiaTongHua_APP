<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑个人资料 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#694324;font-family:Fairy,'STFangsong','Songti SC',serif}button,input{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-head,.art-fields,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m06-p02-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-head{top:0;height:50%;background-position:left top}.art-fields{top:50%;height:37%;background-position:left -105.86cqw}.art-bottom{top:87%;height:13%;background-position:left -184.2cqw}.back{position:absolute;left:4%;top:5%;width:13%;height:6%;border:0;background:transparent;cursor:pointer}.title{position:absolute;left:30%;top:10.4%;margin:0;font-weight:400;font-size:6.5cqw;white-space:nowrap}.avatar{position:absolute;left:61%;top:37%;width:14%;height:8%;opacity:0;cursor:pointer}.change{position:absolute;left:34%;top:43.6%;width:31%;height:4%;border:0;background:transparent;color:#765130;font-size:5cqw;cursor:pointer}.field{position:absolute;left:24%;right:12%;height:6%;display:flex;align-items:center;gap:4%}.field label{width:43%;font-size:4.8cqw;white-space:nowrap}.field input{width:55%;min-width:0;border:0;background:transparent;color:#6c472c;font-size:4.5cqw;text-align:center;outline-color:#d69278}.nickname{top:52%}.birthday{top:60.5%}.saying{top:68.5%;height:8%;display:block}.saying label{display:block;width:100%}.saying input{width:100%;margin-top:3%;text-align:left}.color{top:77%;left:24%}.color label{width:58%}.color input{width:15%;height:5cqw;padding:0;border:0;background:transparent;opacity:0;cursor:pointer}.avatar-preview{position:absolute;left:24%;top:20%;width:53%;height:24%;border-radius:50%;object-fit:cover;display:none}.save{position:absolute;left:26%;top:88%;width:48%;height:7%;border:0;background:transparent;color:#fff;font-size:6.5cqw;cursor:pointer}.toast{position:absolute;left:20%;right:20%;bottom:15%;display:none;padding:2cqw;background:#674b39;color:#fff;border-radius:2cqw;text-align:center;font-size:3cqw}.toast.show{display:block}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="编辑个人资料"><div class="art-head" role="img" aria-label="头像插画和手帐装饰"></div><div class="art-fields" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><img class="avatar-preview" id="avatar-preview" alt="已选择的头像"><button class="back" aria-label="返回我的与设置" onclick="location.href='m06-p01.html'"></button><h1 class="title">编辑个人资料</h1><input class="avatar" id="avatar" type="file" accept="image/*" aria-label="更换头像"><button class="change" onclick="document.querySelector('#avatar').click()">更换头像</button><div class="field nickname"><label for="nickname">昵称</label><input id="nickname" value="小满"></div><div class="field birthday"><label for="birthday">生日</label><input id="birthday" value="6 月 21 日"></div><div class="field saying"><label for="saying">我的一句话</label><input id="saying" value="把平凡的日子写成童话"></div><div class="field color"><label for="color">喜欢的颜色</label><input id="color" type="color" value="#f0b59d"></div><button class="save" id="save">保存资料</button><p class="toast" id="toast" role="status"></p></main><script>const key='dujia-profile';let avatarData=localStorage.getItem('dujia-avatar');const preview=document.querySelector('#avatar-preview');if(avatarData){preview.src=avatarData;preview.style.display='block'}const fields=['nickname','birthday','saying','color'];try{const saved=JSON.parse(localStorage.getItem(key));if(saved)fields.forEach(name=>{if(saved[name])document.getElementById(name).value=saved[name]})}catch{}document.querySelector('#avatar').addEventListener('change',event=>{const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{avatarData=String(reader.result);preview.src=avatarData;preview.style.display='block'};reader.readAsDataURL(file)});document.querySelector('#save').addEventListener('click',()=>{localStorage.setItem(key,JSON.stringify(Object.fromEntries(fields.map(name=>[name,document.getElementById(name).value]))));if(avatarData){try{localStorage.setItem('dujia-avatar',avatarData)}catch{}}const toast=document.querySelector('#toast');toast.textContent='个人资料已保存';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)});</script></body></html>

</style><link rel="stylesheet" href="../assets/ui-foundation.css"></head><body><main class="screen" aria-label="添加照片"><div class="photo-art" role="img" aria-label="海边晚霞照片"></div><button class="back" type="button" aria-label="返回相册" onclick="location.href='m03-p10.html'"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><h1 class="title">添加照片</h1><button class="done" type="button" id="done">完成</button><button class="photo-hit" type="button" id="photo-hit" aria-label="更换照片"><img id="selected" alt="选中的照片"></button><input class="file" id="file" type="file" accept="image/*"><form id="photo-form"><textarea class="caption" name="caption" placeholder="写下这一刻的心情" aria-label="照片心情"></textarea><label class="date"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/></svg><input name="date" value="2026年9月2日" aria-label="照片日期"></label><label class="tags"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8l10 10-8 8L3 11Z"/><circle cx="7" cy="7" r="1"/></svg><input name="tag" value="晚霞" aria-label="照片标签"><button type="button" id="add-tag" class="ui-hit-text" aria-label="添加标签">＋</button></label><fieldset class="visibility"><label><input type="radio" name="visibility" value="shared" checked>共同可见</label><label><input type="radio" name="visibility" value="private">仅自己可见</label></fieldset><p class="hint">共同可见后，TA 可以留下悄悄回应</p><button class="submit" type="submit">保存照片</button></form><p class="toast" id="toast" role="status"></p></main><script>const file=document.querySelector('#file'),image=document.querySelector('#selected'),form=document.querySelector('#photo-form'),toast=document.querySelector('#toast');let timer;function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2500)}document.querySelector('#photo-hit').addEventListener('click'

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新建回忆册 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#603a1e;font-family:Fairy,'STFangsong','Songti SC',serif}button,input{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-middle,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m08-p04-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:45%;background-position:left top}.art-middle{top:45%;height:40%;background-position:left -95.27cqw}.art-bottom{top:85%;height:15%;background-position:left -179.97cqw}h1,h2,p{position:absolute;margin:0;font-weight:400}.back{position:absolute;left:4%;top:1.5%;width:9%;height:6%;border:0;background:transparent;cursor:pointer}.brand{left:44%;top:4%;font-size:4cqw}.title{left:25%;top:8%;font-size:9cqw}.subtitle{left:43%;top:14.2%;font-size:4cqw}.label{left:16%;font-size:5cqw}.label.name{top:24%}.label.date{top:40%}.label.start{top:61.5%}.book-name{position:absolute;left:18%;top:30%;width:58%;height:5%;border:0;outline:0;background:transparent;color:#603a1e;font-size:6cqw}.dates{position:absolute;left:31%;right:15%;top:49%;display:flex;align-items:center;justify-content:space-between;gap:3%;font-size:5cqw}.dates input{width:42%;border:0;outline:0;background:transparent;color:#603a1e;font-size:4.8cqw}.options{position:absolute;left:8%;right:9%;top:67%;height:16%;display:grid;grid-template-columns:1fr 1fr;gap:4%}.options button{border:0;background:transparent;cursor:pointer;color:#603a1e;font-size:4.5cqw;padding-top:21cqw}.options button[aria-pressed=true]{color:#c26954}.private{left:31%;top:84.6%;font-size:4cqw}.next{position:absolute;left:14%;top:90%;width:73%;height:6%;border:0;background:transparent;color:#fff;font-size:5.5cqw;cursor:pointer}.toast{display:none;position:absolute;left:15%;right:15%;bottom:8%;padding:1cqw;background:#fff8e8;border:1px solid #dda98c;border-radius:2cqw;text-align:center;font-size:3cqw}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="新建共同回忆册"><div class="art-top" role="img" aria-label="纸质回忆册创建表单"></div><div class="art-middle" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回" onclick="location.href='m08-p01.html'"></button><p class="brand">独家童话</p><h1 class="title">新建回忆册</h1><p class="subtitle">共同回忆册</p><h2 class="label name">♡ 书名</h2><input class="book-name" aria-label="书名" value="我们的夏天" maxlength="20"><h2 class="label date">▦ 日期范围</h2><div class="dates"><input aria-label="开始月份" type="text" inputmode="numeric" value="2026.06"><input aria-label="结束月份" type="text" inputmode="numeric" value="2026.08"></div><h2 class="label start">从什么开始？</h2><div class="options"><button type="button" aria-pressed="true" data-start="materials">从共同素材开始</button><button type="button" aria-pressed="false" data-start="blank">空白回忆册</button></div><p class="private">仅共同可见素材可放入书中</p><button class="next" type="button">下一步：选择主题</button><div class="toast" role="status"></div></main><script>
document.querySelectorAll('.options button').forEach(b=>b.onclick=()=>document.querySelectorAll('.options button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')));document.querySelector('.next').onclick=()=>{const name=document.querySelector('.book-name').value.trim();const dates=[...document.querySelectorAll('.dates input')].map(x=>x.value);if(!name||!dates[0]||!dates[1]||dates[0]>dates[1]||!/^\d{4}\.\d{2}$/.test(dates[0])||!/^\d{4}\.\d{2}$/.test(dates[1])){const t=document.querySelector('.toast');t.textContent='请填写书名与有效的日期范围';t.style.display='block';return}localStorage.setItem('fairy-memory-draft',JSON.stringify({name,dates,start:document.querySelector('.options button[aria-pressed=true]').dataset.start}));location.href='m08-p05.html'};
</script></body></html>

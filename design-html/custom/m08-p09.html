<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编排日记摘录页 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#603a1e;font-family:Fairy,'STFangsong','Songti SC',serif}button,input,textarea{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-middle,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m08-p09-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:47%;background-position:left top}.art-middle{top:47%;height:39%;background-position:left -99.5cqw}.art-bottom{top:86%;height:14%;background-position:left -182.08cqw}h1,p{position:absolute;margin:0;font-weight:400}.back{position:absolute;left:3%;top:2%;width:8%;height:5%;border:0;background:transparent;cursor:pointer}.brand{left:38%;top:1%;font-size:5cqw;color:#c58269}.tagline{left:36%;top:5.3%;font-size:2.8cqw}.book{right:7%;top:5%;font-size:3cqw}.title{left:25%;top:8.7%;font-size:8cqw}.subtitle{left:26%;top:13.9%;font-size:3.6cqw;color:#917c6d}.field-label{position:absolute;font-size:3.7cqw}.l-title{left:27%;top:24%}.l-excerpt{left:18%;top:33%}.l-photo{left:18%;top:49%}.l-date{left:64%;top:57%}.l-message{left:17%;top:71%}.field{position:absolute;border:0;outline:0;background:transparent;color:#4d311c;resize:none}.field.title-input{left:29%;top:27%;width:51%;height:4%;font-size:5cqw}.field.excerpt{left:26%;top:38%;width:51%;height:10%;font-size:3.5cqw;line-height:1.7}.field.date{left:65%;top:60%;width:22%;height:4%;font-size:4cqw}.field.message{left:21%;top:75%;width:58%;height:4%;font-size:4.2cqw}.actions{position:absolute;left:5%;right:5%;top:85.8%;height:5%;display:grid;grid-template-columns:repeat(3,1fr);gap:2%}.actions button{border:0;background:transparent;color:#573a27;font-size:3.9cqw;cursor:pointer;padding-left:5cqw}.done{position:absolute;left:26%;top:92%;width:49%;height:5.4%;border:0;background:transparent;color:#fff;font-size:5.6cqw;cursor:pointer}.foot{left:37%;top:98%;font-size:3cqw;color:#947761}.toast{display:none;position:absolute;left:15%;right:15%;bottom:10%;padding:1cqw;background:#fff7e8;border:1px solid #dcb17c;border-radius:2cqw;text-align:center;font-size:3cqw}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
.actions button small{display:block;font-size:2.6cqw;color:#ae8f75;white-space:nowrap}</style></head><body><main class="screen" aria-label="编排日记摘录页"><div class="art-top" role="img" aria-label="回忆册中的日记摘录书页与晚霞照片"></div><div class="art-middle" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回版式选择" onclick="location.href='m08-p08.html'"></button><p class="brand">独家童话</p><p class="tagline">只属于我们的爱与回忆</p><p class="book">共同回忆册</p><h1 class="title">编排日记摘录页</h1><p class="subtitle">把日记里的心动，做成我们专属的一页</p><label class="field-label l-title" for="page-title">标题 ♡</label><input class="field title-input" id="page-title" value="晚霞散步"><label class="field-label l-excerpt" for="excerpt">摘录自 ❀</label><textarea class="field excerpt" id="excerpt">天边被晚霞染成了温柔的橘粉色，&#10;我们并肩走着，风也轻轻地。</textarea><p class="field-label l-photo">照片 ♡</p><label class="field-label l-date" for="date">日期 ▦</label><input class="field date" id="date" value="2026.08.16"><label class="field-label l-message" for="message">想对彼此说 ♡</label><input class="field message" id="message" value="和你一起看世界，连日落都变温柔了。"><div class="actions"><button id="changeExcerpt" type="button">换摘录<small>换一段日记</small></button><button id="changePhoto" type="button">换照片<small>换一张照片</small></button><button id="changeTemplate" type="button">换版式<small>换一种排版</small></button></div><button class="done" type="button">完成这一页</button><p class="foot">原始日记保持不变</p><div class="toast" role="status"></div></main><script>
const toast=document.querySelector('.toast');const tell=s=>{toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',2200)};document.getElementById('changeExcerpt').onclick=()=>tell('可直接编辑书页中的摘录文字');document.getElementById('changePhoto').onclick=()=>location.href='m08-p06.html';document.getElementById('changeTemplate').onclick=()=>location.href='m08-p08.html';document.querySelector('.done').onclick=()=>{const data={title:document.getElementById('page-title').value.trim(),excerpt:document.getElementById('excerpt').value.trim(),date:document.getElementById('date').value.trim(),message:document.getElementById('message').value.trim()};if(!data.title){tell('请填写书页标题');return}localStorage.setItem('fairy-memory-page',JSON.stringify(data));location.href='m08-p10.html'};
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择共同素材 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#603a1e;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-middle,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m08-p06-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:37%;background-position:left top}.art-middle{top:37%;height:42%;background-position:left -78.33cqw}.art-bottom{top:79%;height:21%;background-position:left -167.27cqw}h1,p{position:absolute;margin:0;font-weight:400}.back{position:absolute;left:4%;top:2%;width:11%;height:5%;border:0;background:transparent;cursor:pointer}.brand{left:44%;top:3%;font-size:3.8cqw}.title{left:28%;top:6%;font-size:8cqw}.subtitle{left:28%;top:12.5%;font-size:3.6cqw}.tabs{position:absolute;left:5%;right:5%;top:17%;height:4.5%;display:grid;grid-template-columns:repeat(6,1fr)}.tabs button{border:0;background:transparent;color:#693f24;font-size:4cqw;cursor:pointer}.tabs button[aria-selected=true]{color:#d47259}.items{position:absolute;left:5%;right:5%;top:23%;height:68%;display:grid;grid-template-rows:repeat(5,1fr)}.item{position:relative;border:0;background:transparent;cursor:pointer;color:#603a1e;text-align:left}.item h2{position:absolute;top:12%;left:58%;margin:0;font-size:4cqw;font-weight:400}.item p{left:58%;top:40%;font-size:3.1cqw;line-height:1.4}.item small{position:absolute;left:58%;top:66%;font-size:3cqw}.item .check{position:absolute;right:3%;top:38%;width:9%;height:30%;border-radius:50%;background:transparent}.item[aria-pressed=false] .check{background:#fff8e6;border:2px solid #d88670}.item[aria-pressed=false] .check:after{content:'';position:absolute;inset:15%;background:#fff8e6;border-radius:50%}.count{left:17%;top:94.4%;font-size:4.5cqw}.count strong{color:#d87e62;font-size:6cqw;font-weight:400}.next{position:absolute;left:55%;top:92.7%;width:35%;height:5.7%;border:0;background:transparent;color:#fff;font-size:5.6cqw;cursor:pointer}.toast{display:none;position:absolute;left:20%;right:20%;bottom:9%;padding:1cqw;background:#fff8eb;border:1px solid #dcb17c;border-radius:2cqw;text-align:center;font-size:3cqw}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="选择共同素材"><div class="art-top" role="img" aria-label="可选的共同日记、照片、旅程、手作和宠物回忆"></div><div class="art-middle" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回上一步" onclick="location.href='m08-p05.html'"></button><p class="brand">独家童话</p><h1 class="title">选择共同素材</h1><p class="subtitle">挑选你们想放进共同回忆册的素材吧</p><div class="tabs" role="tablist" aria-label="素材分类"><button role="tab" aria-selected="true" data-type="全部">全部</button><button role="tab" aria-selected="false" data-type="日记">日记</button><button role="tab" aria-selected="false" data-type="照片">照片</button><button role="tab" aria-selected="false" data-type="时刻">时刻</button><button role="tab" aria-selected="false" data-type="工坊">工坊</button><button role="tab" aria-selected="false" data-type="宠物">宠物</button></div><div class="items"><button class="item" type="button" aria-pressed="true" data-type="日记" data-title="晚霞散步"><h2>晚霞散步</h2><p>▤ 日记<br>2024.05.18　20:47</p><small>🔒 共同可见</small><span class="check"></span></button><button class="item" type="button" aria-pressed="true" data-type="照片" data-title="一起看日落"><h2>一起看日落</h2><p>▧ 照片<br>2024.04.21　18:36</p><small>🔒 共同可见</small><span class="check"></span></button><button class="item" type="button" aria-pressed="true" data-type="时刻" data-title="第一次旅行"><h2>第一次旅行</h2><p>☆ 重要时刻<br>2023.10.03 – 10.06</p><small>🔒 共同可见</small><span class="check"></span></button><button class="item" type="button" aria-pressed="true" data-type="工坊" data-title="手作明信片"><h2>手作明信片</h2><p>⚒ 工坊作品<br>2024.02.14　15:22</p><small>🔒 共同可见</small><span class="check"></span></button><button class="item" type="button" aria-pressed="true" data-type="宠物" data-title="团子学会握手"><h2>团子学会握手</h2><p>🐾 宠物<br>2024.03.09　11:08</p><small>🔒 共同可见</small><span class="check"></span></button></div><p class="count">已选 <strong id="selectedCount">5</strong> 份素材</p><button class="next" type="button">开始编排</button><div class="toast" role="status"></div></main><script>
const items=[...document.querySelectorAll('.item')];const count=document.getElementById('selectedCount');function update(){count.textContent=items.filter(x=>x.getAttribute('aria-pressed')==='true').length}items.forEach(b=>b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');update()});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));items.forEach(x=>x.style.display=b.dataset.type==='全部'||x.dataset.type===b.dataset.type?'block':'none')});document.querySelector('.next').onclick=()=>{const selected=items.filter(x=>x.getAttribute('aria-pressed')==='true').map(x=>x.dataset.title);if(!selected.length){const t=document.querySelector('.toast');t.textContent='请至少选择一份共同素材';t.style.display='block';return}localStorage.setItem('fairy-memory-selected',JSON.stringify(selected));location.href='m08-p07.html'};
</script></body></html>

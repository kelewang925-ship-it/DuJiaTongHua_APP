<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知设置 · 独家童话</title><style>
@font-face{font-family:Fairy;src:url('../assets/font.ttf') format('truetype');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ded3;color:#57351e;font-family:Fairy,'STFangsong','Songti SC',serif}button{font:inherit}.screen{position:relative;isolation:isolate;width:min(100vw,431px);aspect-ratio:862/1825;overflow:hidden;container-type:inline-size;background:#fff9ed;box-shadow:0 12px 32px #684a3425}.art-top,.art-rows,.art-bottom{position:absolute;z-index:-1;left:0;width:100%;background-image:url('../assets/m06-p10-art.webp');background-repeat:no-repeat;background-size:100cqw 211.72cqw}.art-top{top:0;height:32%;background-position:left top}.art-rows{top:32%;height:56%;background-position:left -67.75cqw}.art-bottom{top:88%;height:12%;background-position:left -186.32cqw}.back{position:absolute;left:2%;top:2%;width:13%;height:8%;border:0;background:transparent;cursor:pointer}.title{position:absolute;left:16%;top:4%;margin:0;font-size:7cqw;font-weight:400}.row{position:absolute;left:29%;right:18%;height:9%}.row strong{display:block;font-size:5.5cqw;font-weight:400;white-space:nowrap}.row small{display:block;margin-top:1%;font-size:3.5cqw;color:#817261;white-space:nowrap}.r1{top:34.5%}.r2{top:48%}.r3{top:61.5%}.r4{top:74.5%}.r5{top:89.5%}.switch{position:absolute;left:78%;width:13%;height:4%;border:0;border-radius:20cqw;background:transparent;cursor:pointer}.switch[aria-checked=false]{background:#d3c8bd}.switch[aria-checked=false]::after{content:'';position:absolute;left:5%;top:6%;width:55%;height:88%;border-radius:50%;background:#fff}.s1{top:36%}.s2{top:49.5%}.s3{top:63%}.s4{top:76%}.s5{top:91%}@media(max-width:431px){body{display:block}.screen{box-shadow:none}}
</style></head><body><main class="screen" aria-label="通知设置"><div class="art-top" role="img" aria-label="信封和铃铛插画"></div><div class="art-rows" aria-hidden="true"></div><div class="art-bottom" aria-hidden="true"></div><button class="back" aria-label="返回设置" onclick="location.href='m06-p07.html'"></button><h1 class="title">通知设置</h1><div class="row r1"><strong>另一半回应</strong><small>共同记录收到新的回应</small></div><button class="switch s1" role="switch" aria-label="另一半回应" aria-checked="true" data-key="replies"></button><div class="row r2"><strong>重要时刻</strong><small>重要章节和纪念日提醒</small></div><button class="switch s2" role="switch" aria-label="重要时刻" aria-checked="true" data-key="moments"></button><div class="row r3"><strong>时光胶囊</strong><small>约定日期到来时提醒</small></div><button class="switch s3" role="switch" aria-label="时光胶囊" aria-checked="true" data-key="capsule"></button><div class="row r4"><strong>工坊完成</strong><small>童话工坊作品完成提醒</small></div><button class="switch s4" role="switch" aria-label="工坊完成" aria-checked="true" data-key="workshop"></button><div class="row r5"><strong>通知总开关</strong></div><button class="switch s5" role="switch" aria-label="通知总开关" aria-checked="true" data-key="all"></button></main><script>const key='dujia-notifications';let settings={replies:true,moments:true,capsule:true,workshop:true,all:true};try{settings={...settings,...JSON.parse(localStorage.getItem(key))}}catch{}function render(){document.querySelectorAll('.switch').forEach(button=>button.setAttribute('aria-checked',String(settings[button.dataset.key])))}document.querySelectorAll('.switch').forEach(button=>button.addEventListener('click',()=>{settings[button.dataset.key]=!settings[button.dataset.key];localStorage.setItem(key,JSON.stringify(settings));render()}));render();</script></body></html>

</style><link rel="stylesheet" href="../assets/ui-foundation.css"></head><body><main class="screen" aria-label="邀请 TA 加入"><div class="hero" role="img" aria-label="女孩捧着邀请函的水彩插画"></div><div class="footer-art" aria-hidden="true"></div><p class="hero-book-title">独家童话</p><p class="hero-book-sub">邀请函</p><h1 class="title">把这张邀请函交给 TA</h1><p class="subtitle">邀请 TA 一起收藏每一段日常</p><section class="invite-card" aria-label="专属邀请码"><p class="code" id="code">XH7K-9M2Q</p><button class="copy" type="button" id="copy">✦ 复制邀请码 ✦</button></section><div class="actions"><button type="button" id="share"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a8 8 0 0 1-8 8H7l-4 3v-6a8 8 0 1 1 18-5Z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg>发送给微信好友</button><button type="button" id="save"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>保存邀请卡</button></div><p class="valid">邀请有效期 24 小时 · 仅可使用一次</p><p class="later">对方确认后，<br>你们才会正式建立关系</p><p class="toast" id="toast" role="status"></p></main><script>const code=document.querySelector('#code').textContent,toast=document.querySelector('#toast');let timer;function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2500)}async function copy(){try{await navigator.clipboard.writeText(code);show('邀请码已复制')}catch{const input=document.createElement('textarea');input.value=code;document.body.append(input);input.select();document.execCommand('copy');input.remove();show('邀请码已复制')}}document.querySelector('#copy').addEventListener('click',copy);document.querySelector('#share').addEventListener('click',async()=>{if(navigator.share){show('正在打开分享面板…');try{await navigator.share({title:'独家童话邀请函',text:`邀请你一起写我们的故事，邀请码：${code}`})}catch{await copy();show('邀请码已复制，可粘贴发送给 TA')}}else{await copy();show('邀请码已复制，可粘贴发送给 TA')}});document.querySelector('#save').addEventListener('click',()=>{const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540"><rect width="100%" height="100%" rx="42" fill="#fff7ef"/><rect x="25" y="25" width="810" height="490" rx="30" fill="none" stroke="#dc9e9c" stroke-width="4"/><text x="430" y="150" text-anchor="middle" font-size="48" fill="#754832">独家童话邀请函</text><text x="430" y="330" text-anchor="middle" font-size="90" fill="#a4454b" font-family="Georgia">${code}</text><text x="430" y="440" text-anchor="middle" font-size="30" fill="#946f5b">邀请 TA 一起收藏每一段日常</text></svg>`;const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download='独家童话邀请卡.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});</script></body></html>
